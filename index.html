<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NCI SCOPE TAGLINE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f0f4f8; }
        .card { transition: all 0.3s ease; border-radius: 1.5rem; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .animate-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .sticky-search { position: sticky; top: 0; z-index: 50; background: rgba(240, 244, 248, 0.95); backdrop-filter: blur(8px); }
    </style>
</head>
<body class="p-3 sm:p-6">

    <div class="max-w-4xl mx-auto">
        <div class="mb-6 border-b-2 border-blue-900 pb-4 text-center md:text-left">
            <h1 class="text-3xl font-black text-blue-900 leading-none">NCI SCOPE TAGLINE</h1>
            <p class="text-[11px] font-bold text-slate-500 mt-2 uppercase tracking-tight">ศูนย์ส่องกล้องระบบทางเดินอาหารสถาบันมะเร็งแห่งชาติ</p>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-blue-900 p-5 rounded-[2rem] text-white shadow-lg">
                <p class="text-[10px] font-bold opacity-70 uppercase">กล้องทั้งหมด</p>
                <p id="total-scopes" class="text-4xl font-black">0</p>
            </div>
            <div class="bg-white p-5 rounded-[2rem] border border-slate-200 shadow-sm">
                <p class="text-[10px] font-bold text-slate-400 uppercase">พร้อมใช้งาน</p>
                <p id="ready-count" class="text-4xl font-black text-emerald-500">0</p>
            </div>
        </div>

        <div class="sticky-search py-3 space-y-3 mb-6">
            <input type="text" id="search-input" placeholder="ค้นหารหัสกล้อง หรือชื่ออุปกรณ์..." 
                class="w-full p-4 rounded-2xl border-2 border-slate-200 shadow-md focus:border-blue-600 outline-none font-bold text-slate-700">
            <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                <button onclick="setFilter('all')" id="btn-all" class="flex-shrink-0 px-8 py-3 rounded-xl bg-blue-900 text-white font-bold text-xs shadow-md">ทั้งหมด</button>
                <button onclick="setFilter('ready')" id="btn-ready" class="flex-shrink-0 px-8 py-3 rounded-xl bg-white text-slate-500 font-bold text-xs border border-slate-200 shadow-sm">พร้อมใช้</button>
                <button onclick="setFilter('repair')" id="btn-repair" class="flex-shrink-0 px-8 py-3 rounded-xl bg-white text-rose-500 font-bold text-xs border border-slate-200 shadow-sm">ส่งซ่อม / วันคืน</button>
            </div>
        </div>

        <div id="scope-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-10">
            <p class="col-span-full text-center text-slate-400 py-10 italic">กำลังดึงข้อมูลกล้อง...</p>
        </div>

        <div class="bg-[#0b3d33] text-white p-6 rounded-t-[2.5rem] shadow-xl mt-12">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-black italic uppercase">Accessories</h2>
                <span id="acc-count" class="text-[10px] bg-emerald-900 px-3 py-1 rounded-full">0 รายการ</span>
            </div>
            <div id="acc-filter" class="flex gap-2 overflow-x-auto no-scrollbar pb-2"></div>
        </div>
        <div class="bg-white rounded-b-[2.5rem] p-4 border-x border-b border-slate-200 mb-24 min-h-[300px]">
            <div id="accessories-list" class="space-y-3">
                <p class="text-center text-slate-400 py-10 italic">กำลังดึงข้อมูลอุปกรณ์...</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxL8VnqCWO-3YuNsMrz5pJ012rLTKTD1gQA2zu8pgENMDQ34YHI8Diyh9NAoVEjskM/exec";
        const WASH_LOG_API = "https://script.google.com/macros/s/AKfycbwUY36cqp5ns2dM5LgT0_MqmwH8k5riXXLDEb3JWo7kzfu81rumQ1opt5URik1H2fCC/exec";
        const ACCESSORIES_API = "https://script.google.com/macros/s/AKfycbz4NQzTP25uJWuiIfdewY3gzLLYyGD0KIgfIQIgVMTe3xGQqkCiq4cRl7Z2fCUPf-tF/exec";

        let allScopes = [], washData = { usageStats: {} }, accData = [], currentFilter = 'all';

        async function init() {
            try {
                const [sRes, wRes, aRes] = await Promise.all([
                    fetch(API_URL).then(r => r.json()),
                    fetch(WASH_LOG_API).then(r => r.json()),
                    fetch(ACCESSORIES_API).then(r => r.json())
                ]);
                
                allScopes = sRes.scopes || sRes || []; // รองรับทั้งรูปแบบมี scopes หรือ array ตรงๆ
                washData = wRes || { usageStats: {} };
                accData = aRes || [];
                
                updateUI();
                renderAccFilters();
            } catch (e) { 
                console.error("Fetch Error:", e);
                document.getElementById('scope-list').innerHTML = `<p class="col-span-full text-center text-rose-500 font-bold">การเชื่อมต่อขัดข้อง กรุณาลองใหม่</p>`;
            }
        }

        function updateUI() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const list = document.getElementById('scope-list');
            
            let filtered = allScopes.filter(s => (s.code || s.itemCode || "").toLowerCase().includes(search));
            
            if (currentFilter === 'ready') filtered = filtered.filter(s => (s.status||"").includes("พร้อม"));
            if (currentFilter === 'repair') filtered = filtered.filter(s => !(s.status||"").includes("พร้อม"));

            document.getElementById('total-scopes').innerText = allScopes.length;
            document.getElementById('ready-count').innerText = allScopes.filter(s => (s.status||"").includes("พร้อม")).length;

            list.innerHTML = filtered.map(s => {
                const code = s.code || s.itemCode || "Unknown";
                const isReady = (s.status||"").includes("พร้อม");
                const usage = washData.usageStats[code] || 0;
                
                return `
                <div class="card bg-white p-6 border border-slate-200 shadow-sm animate-in">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="text-2xl font-black text-slate-800 leading-tight">${code}</h3>
                            <p class="text-[10px] font-bold text-slate-400 uppercase">${s.brand || ''} • ${s.type || ''}</p>
                        </div>
                        <span class="px-3 py-1 rounded-full text-[9px] font-black uppercase ${isReady ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}">
                            ● ${s.status || 'ส่งซ่อม'}
                        </span>
                    </div>
                    <div class="flex justify-between items-center bg-blue-50/50 p-3 rounded-xl mb-3">
                        <span class="text-[9px] font-black text-blue-300 uppercase italic">Usage</span>
                        <span class="text-xl font-black text-blue-800">${usage}</span>
                    </div>
                    ${(!isReady || s.returnDate) ? `
                    <div class="p-3 bg-rose-50 rounded-xl border border-rose-100 text-[11px] font-bold">
                        <div class="flex justify-between"><span>วันที่ส่งซ่อม:</span><span class="text-slate-700">${s.sentDate || '-'}</span></div>
                        <div class="flex justify-between mt-1"><span>กำหนดคืน:</span><span class="text-rose-700 font-black underline">${s.returnDate || '-'}</span></div>
                    </div>` : ''}
                </div>`;
            }).join('');
            
            renderAccessories(accData.filter(i => (i.name||"").toLowerCase().includes(search)));
        }

        function renderAccFilters() {
            const container = document.getElementById('acc-filter');
            const types = ['ทั้งหมด', ...new Set(accData.map(i => i.procedure).filter(p => p))];
            container.innerHTML = types.map(t => `<button onclick="filterAcc('${t}')" class="px-4 py-1.5 rounded-lg bg-emerald-900 text-[10px] font-bold border border-emerald-800 uppercase shadow-inner">${t}</button>`).join('');
        }

        function filterAcc(type) {
            const filtered = type === 'ทั้งหมด' ? accData : accData.filter(i => i.procedure === type);
            renderAccessories(filtered);
        }

        function renderAccessories(items) {
            document.getElementById('acc-count').innerText = `${items.length} รายการ`;
            document.getElementById('accessories-list').innerHTML = items.map(i => `
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 group" onclick="this.classList.toggle('is-open')">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-xl bg-white flex items-center justify-center border border-slate-100 p-1">
                            <img src="${i.imageURL || 'https://via.placeholder.com/80?text=📦'}" class="max-w-full max-h-full object-contain">
                        </div>
                        <div class="flex-grow">
                            <h4 class="text-sm font-black text-slate-800 leading-tight">${i.name || 'ไม่มีชื่อ'}</h4>
                            <p class="text-[9px] font-bold text-slate-400 uppercase mt-0.5">${i.itemCode || '-'} • ${i.procedure || '-'}</p>
                        </div>
                        <svg class="w-4 h-4 text-slate-300 transform transition-transform group-[.is-open]:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-width="3"></path></svg>
                    </div>
                    <div class="hidden group-[.is-open]:block mt-4 pt-4 border-t border-slate-100 animate-in">
                        <div class="grid grid-cols-2 gap-3 mb-3">
                            <div class="bg-white p-3 rounded-xl shadow-inner"><p class="text-[8px] font-bold text-slate-300 uppercase mb-1">Specs</p><p class="text-[10px] font-black">${i.specs || '-'}</p></div>
                            <div class="bg-white p-3 rounded-xl shadow-inner"><p class="text-[8px] font-bold text-slate-300 uppercase mb-1">Stock</p><p class="text-sm font-black ${i.qty > 5 ? 'text-emerald-600' : 'text-rose-500'}">${i.qty || 0} ชิ้น</p></div>
                        </div>
                        <div class="bg-emerald-50/50 p-3 rounded-xl text-[10px] font-medium text-slate-600 italic">ข้อบ่งใช้: ${i.indication || '-'}</div>
                    </div>
                </div>`).join('');
        }

        function setFilter(f) {
            currentFilter = f;
            ['btn-all', 'btn-ready', 'btn-repair'].forEach(id => {
                const btn = document.getElementById(id);
                if(id.includes(f)) {
                    btn.className = "flex-shrink-0 px-8 py-3 rounded-xl bg-blue-900 text-white font-bold text-xs shadow-md";
                } else {
                    btn.className = "flex-shrink-0 px-8 py-3 rounded-xl bg-white text-slate-500 font-bold text-xs border border-slate-200 shadow-sm";
                }
            });
            updateUI();
        }

        document.getElementById('search-input').addEventListener('input', updateUI);
        init(); setInterval(init, 60000); // อัปเดตทุก 1 นาที
    </script>
</body>
</html>
