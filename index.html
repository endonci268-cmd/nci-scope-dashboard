<script>

const API_URL = "https://script.google.com/macros/s/AKfycbyBfC-I98MMD9_Kzsj8YRlYUG-tNz--SdRWxxah-5WJTklYzPuEH7PU1wITSkY4XrYs/exec";

function loadData(){

fetch(API_URL, {
  method: "GET",
  cache: "no-store"
})
.then(res => res.json())
.then(res => {

  console.log("DATA:", res); // debug

  const data = res.scopes || [];

  // 🔥 แก้ปัญหา emoji แล้ว
  const ready = data.filter(s => (s.status || "").includes("พร้อม")).length;
  const repair = data.filter(s => (s.status || "").includes("ซ่อม")).length;
  const inactive = data.filter(s => (s.status || "").includes("งด")).length;

  document.getElementById("ready").innerHTML =
    "🟢 พร้อมใช้งาน<br>" + ready;

  document.getElementById("repair").innerHTML =
    "🔴 ส่งซ่อม<br>" + repair;

  document.getElementById("inactive").innerHTML =
    "🟡 งดใช้งาน<br>" + inactive;

  document.getElementById("info").innerHTML =
    "📊 " + (res.total || data.length) + " รายการ • 🕒 " + (res.updated || "-");

  render(data);

})
.catch(err=>{
  console.error("ERROR:", err);
  document.getElementById("info").innerHTML = "❌ โหลดข้อมูลไม่ได้";
});

}

function render(data){

  let html = "";

  data.forEach(s => {

    html += `
      <div class="card">
        <div class="code">${s.code}</div>
        <div class="serial">SN: ${s.serial || "-"}</div>
        <div class="sub">${s.brand} | ${s.type}</div>
        <div class="status">${s.status}</div>
      </div>
    `;
  });

  document.getElementById("list").innerHTML = html;
}

// 🔥 โหลดครั้งแรก
loadData();

// 🔥 refresh ทุก 5 วิ
setInterval(loadData, 5000);

</script>
