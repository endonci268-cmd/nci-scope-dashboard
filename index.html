<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NCI SCOPE TAGLINE - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f0f4f8; }
        .card { transition: all 0.3s ease; border-radius: 1.5rem; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .animate-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .sticky-search { position: sticky; top: 0; z-index: 50; background: rgba(240, 244, 248, 0.9); backdrop-filter: blur(8px); }
    </style>
</head>
<body class="p-3 sm:p-6">

    <div class="max-w-4xl mx-auto">
        <div class="mb-6 border-b-2 border-blue-900 pb-4">
            <h1 class="text-3xl font-black text-blue-900 leading-none">NCI SCOPE TAGLINE</h1>
            <p class="text-sm font-bold text-slate-500 mt-1 uppercase tracking-tight">ระบบจัดการกล้องและอุปกรณ์ ศูนย์ส่องกล้องฯ สถาบันมะเร็งแห่งชาติ</p>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
            <div class="bg-blue-900 p-4 rounded-3xl text-white shadow-lg">
                <p class="text-[10px] font-bold opacity-70">กล้องทั้งหมด</p>
                <p id="total-scopes" class="text-3xl font-black">0</p>
            </div>
            <div class="bg-white p-4 rounded-3xl border border-slate-200 shadow-sm">
                <p class="text-[10px] font-bold text-slate-400 uppercase">พร้อมใช้</p>
                <p id="ready-count" class="text-3xl font-black text-emerald-500">0</p>
            </div>
            <div class="bg-white p-4 rounded-3xl border border-slate-200 shadow-sm col-span-2">
                <p class="text-[10px] font-bold text-slate-400 uppercase">อัตราความพร้อม</p>
                <div class="flex items-center gap-3">
                    <p id="ready-percent" class="text-3xl font-black text-blue-600">0%</p>
                    <div class="flex-grow bg-slate-100 h-3 rounded-full overflow-hidden">
                        <div id="progress-bar" class="h-full bg-blue-600 transition-all duration-1000" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="sticky-search py-3 space-y-3 mb-6">
            <input type="text" id="search-input" placeholder="ค้นหารหัสกล้อง หรือชื่ออุปกรณ์..." 
                class="w-full p-4 rounded-2xl border-2 border-slate-200 shadow-sm focus:border-blue-600 outline-none font-bold text-slate-700">
            <div class="flex gap-2 overflow-x-auto no-scrollbar">
                <button onclick="setFilter('all')" id="btn-all" class="flex-shrink-0 px-6 py-2.5 rounded-xl bg-blue-900 text-white font-bold text-xs shadow-md">ทั้งหมด</button>
                <button onclick="setFilter('ready')" id="btn-ready" class="flex-shrink-0 px-6 py-2.5 rounded-xl bg-white text-slate-500 font-bold text-xs border border-slate-200">พร้อมใช้</button>
                <button onclick="setFilter('repair')" id="btn-repair" class="flex-shrink-0 px-6 py-2.5 rounded-xl bg-white text-rose-500 font-bold text-xs border border-slate-200">ส่งซ่อม/แจ้งคืน</button>
            </div>
        </div>

        <div id="scope-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-10">
            </div>

        <div class="bg-white rounded-[2rem] p-6 shadow-sm border border-slate-200 mb-8">
            <h2 class="text-xl font-black text-blue-900 mb-4 flex items-center gap-2">
                <span class="w-1.5 h-6 bg-blue-600 rounded-full"></span> ประวัติการล้าง (ล่าสุด)
            </h2>
            <div id="wash-log" class="space-y-2"></div>
        </div>

        <div class="bg-[#0b3d33] text-white p-6 rounded-t-[2rem] shadow-xl">
            <div class="flex justify-between items-end">
                <h2 class="text-2xl font-black italic">ACCESSORIES</h2>
                <div id="acc-filter" class="flex gap-2 overflow-x-auto no-scrollbar"></div>
            </div>
        </div>
        <div class="bg-white rounded-b-[2rem] p-4 border-x border-b border-slate-200 mb-20 min-h-[300px]">
            <div id="accessories-list" class="space-y-3"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxL8VnqCWO-3YuNsMrz5pJ012rLTKTD1gQA2zu8pgENMDQ34YHI8Diyh9NAoVEjskM/exec";
        const WASH_LOG_API = "https://script.google.com/macros/s/AKfycbwUY36cqp5ns2dM5LgT0_MqmwH8k5riXXLDEb3JWo7kzfu81rumQ1opt5URik1H2fCC/exec";
        const ACCESSORIES_API = "https://script.google.com/macros/s/AKfycbz4NQzTP25uJWuiIfdewY3gzLLYyGD0KIgfIQIgVMTe3xGQqkCiq4cRl7Z2fCUPf-tF/exec";

        let allScopes = [], washData = {}, accData = [], currentFilter = 'all';

        async function init() {
            try {
                const [sRes, wRes, aRes] = await Promise.all([
                    fetch(API_URL).then(r => r.json()),
                    fetch(WASH_LOG_API).then(r => r.json()),
                    fetch(ACCESSORIES_API).then(r => r.json())
                ]);
                allScopes = sRes.scopes || [];
                washData = wRes || { usageStats: {}, recentWashes: [] };
                accData = (aRes || []).filter(i => i.itemCode);
                
                updateUI();
                renderAccFilters();
            } catch (e) { console.error(e); }
        }

        function updateUI() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const list = document.getElementById('scope-list');
            
            // กรองข้อมูล
            let filtered = allScopes.filter(s => (s.code||"").toLowerCase().includes(search));
            if (currentFilter === 'ready') filtered = filtered.filter(s => (s.status||"").includes("พร้อม"));
            if (currentFilter === 'repair') filtered = filtered.filter(s => !(s.status||"").includes("พร้อม"));

            // อัปเดตสถิติ
            const total = allScopes.length;
            const ready = allScopes.filter(s => (s.status||"").includes("พร้อม")).length;
            const percent = total > 0 ? Math.round((ready/total)*100) : 0;
            
            document.getElementById('total-scopes').innerText = total;
            document.getElementById('ready-count').innerText = ready;
            document.getElementById('ready-percent').innerText = `${percent}%`;
            document.getElementById('progress-bar').style.width = `${percent}%`;

            // วาดการ์ดกล้อง
            list.innerHTML = filtered.map(s => {
                const isReady = (s.status||"").includes("พร้อม");
                const usage = washData.usageStats[s.code] || 0;
                return `
                <div class="card bg-white p-5 border border-slate-200 shadow-sm animate-in">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="text-2xl font-black text-slate-800 leading-tight">${s.code}</h3>
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">${s.brand} • ${s.type}</p>
                        </div>
                        <span class="px-3 py-1 rounded-full text-[10px] font-black uppercase ${isReady ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-700'}">
                            ● ${s.status}
                        </span>
                    </div>
                    <div class="flex justify-between items-center bg-blue-50/50 p-3 rounded-2xl mb-3">
                        <span class="text-[10px] font-black text-blue-300 uppercase italic tracking-widest">Usage</span>
                        <span class="text-xl font-black text-blue-800">${usage}</span>
                    </div>
                    ${
