<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NCI SCOPE - Modern Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; }
        .card { transition: all 0.2s ease; }
        .card:hover { transform: translateY(-2px); }
        .progress-bar-fill { transition: width 1s ease-in-out; }
        /* สไตล์เพิ่มเติมสำหรับตาราง */
        .table-container { scrollbar-width: thin; }
    </style>
</head>
<body class="p-4 md:p-8 text-slate-800">

    <div class="max-w-5xl mx-auto">
        <div class="mb-8 flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div>
                <h1 class="text-3xl font-bold text-blue-900">NCI SCOPETAGLINE</h1>
                <p class="text-slate-500 text-sm font-light">ระบบจัดการสถานะกล้องส่องตรวจ • สถาบันมะเร็งแห่งชาติ</p>
            </div>
            <div class="text-right">
                <span id="last-update" class="text-[11px] text-slate-400 bg-white px-3 py-1 rounded-full shadow-sm border border-slate-100 italic">
                    กำลังดึงข้อมูล...
                </span>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="md:col-span-2 bg-white rounded-3xl p-6 shadow-sm border border-slate-100">
                <div class="flex justify-between items-center mb-4">
                    <div class="flex items-center gap-2">
                        <div class="p-2 bg-blue-50 rounded-lg">
                            <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                        <span class="font-semibold text-slate-700">ความพร้อมใช้งานรวม</span>
                    </div>
                    <span id="availability-percent" class="text-2xl font-bold text-blue-600">0%</span>
                </div>
                <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
                    <div id="progress-fill" class="progress-bar-fill h-full bg-blue-500 shadow-[0_0_10px_rgba(59,130,246,0.5)]" style="width: 0%"></div>
                </div>
            </div>
            
            <div class="bg-blue-900 rounded-3xl p-6 shadow-lg text-white flex flex-col justify-center">
                <p class="text-blue-200 text-sm mb-1">จำนวนกล้องทั้งหมด</p>
                <h2 class="text-4xl font-bold"><span id="count-all">0</span> <small class="text-lg font-light">ตัว</small></h2>
            </div>
        </div>

        <div class="flex flex-col md:flex-row gap-4 mb-8">
            <div class="relative flex-grow">
                <input type="text" id="search-input" placeholder="ค้นหารหัสกล้อง หรือยี่ห้อ..." 
                    class="w-full p-4 pl-12 rounded-2xl border-none shadow-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white text-slate-700 transition-all">
                <svg class="w-5 h-5 absolute left-4 top-4.5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            <div class="flex gap-2 bg-white p-1.5 rounded-2xl shadow-sm border border-slate-100 overflow-x-auto">
                <button onclick="filterData('all')" id="btn-all" class="px-5 py-2 rounded-xl bg-blue-600 text-white text-sm font-medium transition-all">ทั้งหมด</button>
                <button onclick="filterData('ready')" id="btn-ready" class="px-5 py-2 rounded-xl text-slate-500 hover:bg-slate-50 text-sm font-medium transition-all">พร้อมใช้ <span id="count-ready" class="ml-1 opacity-60">0</span></button>
                <button onclick="filterData('repair')" id="btn-repair" class="px-5 py-2 rounded-xl text-slate-500 hover:bg-slate-50 text-sm font-medium transition-all">ส่งซ่อม <span id="count-repair" class="ml-1 opacity-60">0</span></button>
            </div>
        </div>

        <div id="scope-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12">
            </div>

        <div class="bg-white rounded-[2rem] p-8 shadow-sm border border-slate-100 mb-10">
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center gap-3">
                    <div class="w-2 h-8 bg-blue-600 rounded-full"></div>
                    <h2 class="text-xl font-bold text-slate-800">ประวัติการล้างล่าสุด</h2>
                </div>
                <span class="text-xs text-slate-400 bg-slate-50 px-3 py-1 rounded-full border border-slate-100">10 รายการล่าสุด</span>
            </div>
            <div class="table-container overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="text-slate-400 text-xs uppercase tracking-widest border-b border-slate-50">
                            <th class="pb-4 font-semibold">วันที่ล้าง</th>
                            <th class="pb-4 font-semibold text-center">รหัสกล้อง</th>
                            <th class="pb-4 font-semibold">Serial Number</th>
                        </tr>
                    </thead>
                    <tbody id="wash-log-table-body" class="text-slate-600">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxL8VnqCWO-3YuNsMrz5pJ012rLTKTD1gQA2zu8pgENMDQ34YHI8Diyh9NAoVEjskM/exec";
        const WASH_LOG_API = "https://script.google.com/macros/s/AKfycbxB2ytW3cYMOEs79yOx6drY4_2EN9EVxA9Hqa0hDszzaM1Ql3KnOu92RhVEUgqrcV1U/exec";

        let scopeData = [];
        let usageStats = {};
        let recentWashes = [];
        let currentFilter = 'all';

        async function fetchData() {
            try {
                const [scopeRes, washRes] = await Promise.all([
                    fetch(API_URL).then(res => res.json()),
                    fetch(WASH_LOG_API).then(res => res.json())
                ]);

                if (scopeRes && scopeRes.scopes) {
                    scopeData = scopeRes.scopes;
                    usageStats = washRes.usageStats || {};
                    recentWashes = washRes.recentWashes || [];
                    
                    updateStats();
                    renderUI();
                    renderHistoryTable();
                    
                    const now = new Date();
                    document.getElementById('last-update').innerText = `อัปเดตล่าสุด • ${now.toLocaleTimeString('th-TH')}`;
                }
            } catch (error) {
                console.error("Fetch Error:", error);
                document.getElementById('last-update').innerText = "⚠️ การเชื่อมต่อล้มเหลว";
            }
        }

        function updateStats() {
            const total = scopeData.length;
            const ready = scopeData.filter(s => (s.status || "").includes('พร้อม')).length;
            const repair = total - ready;
            const percent = total > 0 ? Math.round((ready / total) * 100) : 0;

            document.getElementById('count-all').innerText = total;
            document.getElementById('count-ready').innerText = ready;
            document.getElementById('count-repair').innerText = repair;
            document.getElementById('availability-percent').innerText = `${percent}%`;
            document.getElementById('progress-fill').style.width = `${percent}%`;
        }

        function filterData(type) {
            currentFilter = type;
            renderUI();
            
            // ปรับแต่งสีปุ่ม
            const buttons = {
                all: document.getElementById('btn-all'),
                ready: document.getElementById('btn-ready'),
                repair: document.getElementById('btn-repair')
            };

            Object.keys(buttons).forEach(key => {
                if (key === type) {
                    buttons[key].className = `px-5 py-2 rounded-xl bg-blue-600 text-white text-sm font-medium shadow-md transition-all`;
                } else {
                    buttons[key].className = `px-5 py-2 rounded-xl text-slate-500 hover:bg-slate-50 text-sm font-medium transition-all`;
                }
            });
        }

        function renderUI() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            let filtered = scopeData.filter(s => 
                (s.code || "").toLowerCase().includes(searchTerm) || 
                (s.brand || "").toLowerCase().includes(searchTerm)
            );

            if (currentFilter === 'ready') filtered = filtered.filter(s => (s.status || "").includes('พร้อม'));
            if (currentFilter === 'repair') filtered = filtered.filter(s => !(s.status || "").includes('พร้อม'));

            const grid = document.getElementById('scope-grid');
            if (filtered.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center py-20 text-slate-400 font-light italic">ไม่พบข้อมูลกล้องที่คุณกำลังค้นหา</p>`;
                return;
            }

            grid.innerHTML = filtered.map(scope => {
                const isReady = (scope.status || "").includes('พร้อม');
                const washCount = usageStats[scope.code] || 0; 
                
                return `
                    <div class="card bg-white p-6 rounded-[2rem] shadow-sm border border-slate-50 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <h3 class="text-xl font-bold text-slate-800 leading-none mb-1">${scope.code || '-'}</h3>
                                    <span class="text-[10px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded font-bold uppercase tracking-wider italic">
                                        ${scope.brand || '-'}
                                    </span>
                                </div>
                                <span class="px-3 py-1 rounded-full text-[11px] font-bold shadow-sm ${isReady ? 'bg-green-100 text-green-600 border border-green-200' : 'bg-red-100 text-red-600 border border-red-200'}">
                                    ${scope.status || 'Unknown'}
                                </span>
                            </div>
                            <p class="text-xs text-slate-400 font-medium mb-4">${scope.type || '-'} ${scope.diameter ? '• '+scope.diameter+'mm' : ''}</p>
                            
                            <div class="bg-blue-50/50 rounded-2xl p-4 mb-4 border border-blue-100/30">
                                <div class="flex justify-between items-center">
                                    <span class="text-[11px] font-semibold text-blue-400 uppercase tracking-widest">Usage History</span>
                                    <span class="text-2xl font-black text-blue-700">${washCount} <small class="text-[10px] font-normal text-blue-400">ครั้ง</small></span>
                                </div>
                            </div>
                        </div>

                        <div class="mt-2 pt-4 border-t border-slate-50 flex justify-between items-center">
                            <span class="text-[10px] font-semibold text-slate-300">S/N: ${scope.serial || '-'}</span>
                            ${!isReady ? `
                                <div class="bg-red-50 text-red-500 px-3 py-1.5 rounded-xl border border-red-100 text-[10px] font-bold">
                                    คลาดยังไม่ได้คืน
                                </div>
                            ` : `
                                <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
                            `}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderHistoryTable() {
            const tableBody = document.getElementById('wash-log-table-body');
            if (!tableBody || recentWashes.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="3" class="py-10 text-center text-slate-300 italic">ไม่มีประวัติการล้างของวันนี้</td></tr>`;
                return;
            }

            tableBody.innerHTML = recentWashes.map(w => `
                <tr class="border-b border-slate-50 hover:bg-slate-50 transition-colors group">
                    <td class="py-4 text-sm font-medium text-slate-400">${w.date}</td>
                    <td class="py-4 text-center">
                        <span class="px-3 py-1 bg-blue-50 text-blue-600 rounded-lg font-bold text-xs group-hover:bg-blue-600 group-hover:text-white transition-all">
                            ${w.code}
                        </span>
                    </td>
                    <td class="py-4 text-sm text-slate-400 font-mono">${w.sn}</td>
                </tr>
            `).join('');
        }

        document.getElementById('search-input').addEventListener('input', renderUI);
        fetchData();
        setInterval(fetchData, 60000); // อัปเดตทุก 1 นาที
    </script>
</body>
</html>
