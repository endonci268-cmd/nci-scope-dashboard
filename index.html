<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NCI SCOPE - Modern Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; }
        .card { transition: all 0.2s ease; }
        .progress-bar-fill { transition: width 1s ease-in-out; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <!-- Progress Card (เหมือน Lovable) -->
        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 mb-6">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-2 text-slate-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    <span class="font-medium">อัตราความพร้อมใช้งาน</span>
                </div>
                <span id="availability-percent" class="text-2xl font-bold text-green-600">0%</span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-4 overflow-hidden">
                <div id="progress-fill" class="progress-bar-fill h-full bg-green-500" style="width: 0%"></div>
            </div>
            <p id="last-update" class="text-[11px] text-slate-400 mt-4">กำลังอัปเดตข้อมูล...</p>
        </div>

        <!-- Search & Filters -->
        <div class="flex flex-col md:flex-row gap-4 mb-8">
            <div class="relative flex-grow">
                <input type="text" id="search-input" placeholder="ค้นหารหัสกล้อง..." 
                    class="w-full p-3 pl-10 rounded-2xl border-none shadow-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                <svg class="w-5 h-5 absolute left-3 top-3.5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            <div class="flex gap-2 overflow-x-auto pb-2 md:pb-0">
                <button onclick="filterData('all')" id="btn-all" class="px-4 py-2 rounded-xl bg-blue-600 text-white shadow-md whitespace-nowrap text-sm">ทั้งหมด <span id="count-all">0</span></button>
                <button onclick="filterData('ready')" id="btn-ready" class="px-4 py-2 rounded-xl bg-white text-green-600 border border-green-100 shadow-sm whitespace-nowrap text-sm font-semibold">พร้อมใช้ <span id="count-ready">0</span></button>
                <button onclick="filterData('repair')" id="btn-repair" class="px-4 py-2 rounded-xl bg-white text-red-600 border border-red-100 shadow-sm whitespace-nowrap text-sm font-semibold">ส่งซ่อม <span id="count-repair">0</span></button>
            </div>
        </div>

        <!-- Dashboard Grid -->
        <div id="scope-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- ข้อมูลจะถูกโหลดใส่ที่นี่ -->
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxL8VnqCWO-3YuNsMrz5pJ012rLTKTD1gQA2zu8pgENMDQ34YHI8Diyh9NAoVEjskM/exec";
        let scopeData = [];
        let currentFilter = 'all';

        async function fetchData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                scopeData = data.scopes;
                updateStats();
                renderUI();
                
                const now = new Date();
                document.getElementById('last-update').innerText = `อัปเดตล่าสุด • ${now.toLocaleDateString('th-TH')} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            } catch (error) {
                console.error("Error:", error);
            }
        }

        function updateStats() {
            const total = scopeData.length;
            const ready = scopeData.filter(s => s.status.includes('พร้อม')).length;
            const repair = total - ready;
            const percent = total > 0 ? Math.round((ready / total) * 100) : 0;

            document.getElementById('count-all').innerText = total;
            document.getElementById('count-ready').innerText = ready;
            document.getElementById('count-repair').innerText = repair;
            document.getElementById('availability-percent').innerText = `${percent}%`;
            document.getElementById('progress-fill').style.width = `${percent}%`;
        }

        function filterData(type) {
            currentFilter = type;
            renderUI();
            
            document.getElementById('btn-all').className = type === 'all' ? 'px-4 py-2 rounded-xl bg-blue-600 text-white shadow-md text-sm' : 'px-4 py-2 rounded-xl bg-white text-blue-600 border border-blue-50 shadow-sm text-sm';
            document.getElementById('btn-ready').className = type === 'ready' ? 'px-4 py-2 rounded-xl bg-green-600 text-white shadow-md text-sm font-semibold' : 'px-4 py-2 rounded-xl bg-white text-green-600 border border-green-100 shadow-sm text-sm';
            document.getElementById('btn-repair').className = type === 'repair' ? 'px-4 py-2 rounded-xl bg-red-600 text-white shadow-md text-sm font-semibold' : 'px-4 py-2 rounded-xl bg-white text-red-600 border border-red-100 shadow-sm text-sm';
        }

        function renderUI() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            let filtered = scopeData.filter(s => s.code.toLowerCase().includes(searchTerm));

            if (currentFilter === 'ready') filtered = filtered.filter(s => s.status.includes('พร้อม'));
            if (currentFilter === 'repair') filtered = filtered.filter(s => !s.status.includes('พร้อม'));

            const grid = document.getElementById('scope-grid');
            grid.innerHTML = filtered.map(scope => {
                const isReady = scope.status.includes('พร้อม');
                return `
                    <div class="card bg-white p-5 rounded-2xl shadow-sm border border-slate-50">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <h3 class="text-lg font-bold text-slate-800">${scope.code}</h3>
                                <p class="text-[12px] text-slate-500 font-medium">${scope.type} • ${scope.diameter}mm</p>
                            </div>
                            <span class="px-2.5 py-1 rounded-lg text-[10px] font-bold ${isReady ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}">
                                ${scope.status}
                            </span>
                        </div>
                        <!-- ส่วน S/N ที่ปรับให้ใหญ่ขึ้น -->
                        <div class="mt-3 pt-3 border-t border-slate-50 flex justify-between items-center">
                            <span class="text-sm font-semibold text-slate-700 bg-slate-50 px-2 py-1 rounded-md">S/N: ${scope.serial}</span>
                            ${!isReady ? `<span class="text-[10px] bg-red-50 text-red-500 p-1.5 rounded-lg border border-red-100 font-bold">คืน: ${scope.returnDate}</span>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        document.getElementById('search-input').addEventListener('input', renderUI);
        fetchData();
        setInterval(fetchData, 60000);
    </script>
</body>
</html>
