<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NCI SCOPE TAGLINE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f4f7fa; }
        .card-main { background: white; border-radius: 2.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid white; }
        .usage-box { background: #f0f7ff; border-radius: 1.5rem; padding: 1.25rem; border: 1px solid #e1efff; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .animate-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .sticky-header { position: sticky; top: 0; z-index: 100; background: rgba(244, 247, 250, 0.95); backdrop-filter: blur(10px); }
        .acc-tab { transition: all 0.2s; border-radius: 99px; font-size: 11px; font-weight: 600; padding: 6px 16px; border: 1px solid rgba(255,255,255,0.2); }
    </style>
</head>
<body class="p-3 sm:p-6 md:p-8">

    <div class="max-w-4xl mx-auto">
        <div class="mb-6 flex flex-col md:flex-row justify-between items-center gap-4 text-center md:text-left">
            <div>
                <h1 class="text-2xl md:text-4xl font-black text-blue-900 uppercase italic leading-none">NCI SCOPE TAGLINE</h1>
                <p class="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-tight italic">ศูนย์ส่องกล้องระบบทางเดินอาหาร สถาบันมะเร็งแห่งชาติ</p>
            </div>
            <div id="ready-percent-label" class="bg-blue-600 text-white px-8 py-2 rounded-full font-black text-lg shadow-lg">พร้อมใช้ 0%</div>
        </div>

        <div class="sticky-header py-2 mb-8">
            <input type="text" id="search-input" placeholder="ค้นหา S/N หรือ รหัสกล้อง..." class="w-full p-4 rounded-2xl border-none shadow-lg outline-none font-bold text-slate-700">
        </div>

        <div id="scope-list" class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-12"></div>

        <div class="card-main p-6 md:p-8 animate-in mb-12 border border-blue-100 bg-blue-50/20">
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-black italic shadow-md uppercase text-[10px]">WASH</div>
                    <h2 class="text-xl font-black text-slate-800 uppercase italic">Wash Summary List</h2>
                </div>
                <button onclick="init()" class="text-[10px] font-bold text-blue-600 bg-white px-4 py-1 rounded-full border border-blue-100 hover:bg-blue-50 transition-all uppercase italic">🔄 อัปเดตข้อมูลล่าสุด</button>
            </div>
            <div class="overflow-x-auto no-scrollbar max-h-[500px] overflow-y-auto">
                <table class="w-full text-left">
                    <thead class="sticky top-0 bg-white shadow-sm z-10">
                        <tr class="text-[10px] text-slate-300 font-black uppercase italic">
                            <th class="pb-4 pr-4">วันที่/เวลา</th>
                            <th class="pb-4 pr-4 text-center">รหัสกล้อง</th>
                            <th class="pb-4">Serial Number</th>
                        </tr>
                    </thead>
                    <tbody id="wash-summary-body"></tbody>
                </table>
            </div>
        </div>

        <div class="bg-[#0b3d33] text-white p-6 md:p-10 rounded-[2.5rem] shadow-xl mb-20 animate-in">
            <div class="mb-6">
                <h2 class="text-2xl font-black italic text-emerald-400 uppercase leading-none">Accessories Catalog</h2>
                <p class="text-emerald-200/50 text-[10px] font-bold uppercase tracking-widest mt-1 italic leading-none">Inventory Management</p>
            </div>
            <div id="accessories-list" class="space-y-3"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxL8VnqCWO-3YuNsMrz5pJ012rLTKTD1gQA2zu8pgENMDQ34YHI8Diyh9NAoVEjskM/exec";
        const WASH_LOG_API = "https://script.google.com/macros/s/AKfycbwUY36cqp5ns2dM5LgT0_MqmwH8k5riXXLDEb3JWo7kzfu81rumQ1opt5URik1H2fCC/exec";
        const ACCESSORIES_API = "https://script.google.com/macros/s/AKfycbz4NQzTP25uJWuiIfdewY3gzLLYyGD0KIgfIQIgVMTe3xGQqkCiq4cRl7Z2fCUPf-tF/exec";

        let allScopes = [], washLogs = [], accData = [];

        const superCleanSN = (str) => {
            if (!str) return "";
            return String(str).replace(/[^a-zA-Z0-9]/g, "").trim().toUpperCase();
        };

        async function init() {
            try {
                const ts = new Date().getTime();
                const [sRes, wRes, aRes] = await Promise.all([
                    fetch(`${API_URL}?t=${ts}`).then(r => r.json()),
                    fetch(`${WASH_LOG_API}?t=${ts}`).then(r => r.json()),
                    fetch(`${ACCESSORIES_API}?t=${ts}`).then(r => r.json())
                ]);
                allScopes = sRes.scopes || sRes || [];
                washLogs = wRes.recentWashes || [];
                accData = aRes || [];
                updateUI();
            } catch (e) { console.error("Init Error:", e); }
        }

        function updateUI() {
            const search = document.getElementById('search-input').value.toLowerCase().trim();
            
            const total = allScopes.length;
            const readyCount = allScopes.filter(s => (s.status||"").includes("พร้อม")).length;
            document.getElementById('ready-percent-label').innerText = `พร้อมใช้ ${total > 0 ? Math.round((readyCount/total)*100) : 0}%`;

            // Render Scope Cards
            let filteredScopes = allScopes.filter(s => (s.code||"").toLowerCase().includes(search) || superCleanSN(s.serial).includes(superCleanSN(search)));
            
            document.getElementById('scope-list').innerHTML = filteredScopes.map(s => {
                const isReady = (s.status||"").includes("พร้อม");
                
                // --- จุดที่ปรับปรุง: ดึงยอด Usage จากคอลัมน์ L ในชีททะเบียนกล้อง ---
                // โดยปกติ Google Apps Script จะส่งคอลัมน์ใหม่มาตามลำดับ พี่ต้องเช็กชื่อตัวแปรที่ส่งมาจากชีทคอลัมน์ L
                // ผมใส่ตัวแปร s.usageCount เผื่อไว้ให้ก่อนครับ
                const finalUsage = s.usageCount || 0; 

                return `
                <div class="card-main p-6 md:p-8 animate-in flex flex-col h-full border border-slate-50">
                    <div class="flex justify-between items-start mb-4">
                        <div><h3 class="text-3xl font-black text-slate-800 uppercase italic">${s.code}</h3><span class="px-2 py-0.5 bg-slate-100 text-slate-400 rounded text-[9px] font-black uppercase italic tracking-widest">${s.brand || 'FUJINON'}</span></div>
                        <span class="px-3 py-1 rounded-full text-[9px] font-black uppercase ${isReady ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}">● ${isReady ? 'พร้อมใช้' : 'ส่งซ่อม'}</span>
                    </div>
                    <div class="usage-box flex justify-between items-center mb-6">
                        <span class="text-[10px] font-black text-blue-400 uppercase italic leading-none tracking-widest">Usage History (S/N)</span>
                        <div class="flex items-baseline gap-1">
                            <span class="text-4xl font-black text-blue-700 leading-none">${finalUsage}</span>
                            <span class="text-[10px] font-bold text-blue-300">ครั้ง</span>
                        </div>
                    </div>
                    <div class="mt-auto pt-6 border-t border-slate-50 flex justify-between items-center">
                        <div><p class="text-[8px] font-black text-slate-300 uppercase italic mb-1 leading-none">Serial Number</p><p class="text-xl font-black text-slate-800 tracking-tight leading-none">${s.serial || '-'}</p></div>
                        <div class="w-3 h-3 ${isReady ? 'bg-emerald-400 shadow-[0_0_10px_#4ade80]' : 'bg-rose-400'} rounded-full"></div>
                    </div>
                </div>`;
            }).join('');

            // Render Wash Summary List (ตารางที่พี่ชอบ)
            document.getElementById('wash-summary-body').innerHTML = washLogs.map(w => `
                <tr class="text-[11px] font-bold text-slate-600 border-b border-slate-50">
                    <td class="py-4 text-slate-400 italic font-black text-[9px]">${w.date}</td>
                    <td class="py-4 text-center"><span class="bg-blue-50 text-blue-600 px-3 py-1 rounded-lg uppercase italic font-black text-[10px]">${w.code}</span></td>
                    <td class="py-4 text-slate-800 font-black">${w.sn}</td>
                </tr>`).join('');

            // Render Accessories
            document.getElementById('accessories-list').innerHTML = accData.map(i => `
                <div class="bg-white/95 rounded-[1.5rem] p-4 flex items-center justify-between shadow-lg border border-emerald-900/10">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 bg-slate-50 rounded-lg p-1 border border-slate-100 flex items-center justify-center overflow-hidden"><img src="${i.imageURL}" class="w-full h-full object-contain"></div>
                        <div><h4 class="text-xs font-bold text-slate-800">${i.name}</h4><p class="text-[9px] font-bold text-emerald-600/50 uppercase italic leading-none mt-1">${i.procedure}</p></div>
                    </div>
                    <div class="text-right leading-none font-black"><p class="text-[8px] font-bold text-slate-400 uppercase italic leading-none mb-1">Stock</p><p class="text-lg font-black text-emerald-600 leading-none italic">${i.qty}</p></div>
                </div>`).join('');
        }

        document.getElementById('search-input').addEventListener('input', updateUI);
        init(); setInterval(init, 30000);
    </script>
</body>
</html>
