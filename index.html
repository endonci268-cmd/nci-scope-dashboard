<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NCI SCOPE TAGLINE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f4f7fa; color: #1e293b; }
        .card-main { background: white; border-radius: 2rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; height: 100%; display: flex; flex-direction: column; }
        .usage-box { background: #eff6ff; border-radius: 1.25rem; padding: 1rem; border: 1px solid #dbeafe; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .animate-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .sticky-header { position: sticky; top: 0; z-index: 100; background: rgba(244, 247, 250, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.3); }
        .acc-tab { transition: all 0.2s; border-radius: 99px; font-size: 11px; font-weight: 600; padding: 8px 20px; border: 1px solid #e2e8f0; }
        details summary::-webkit-details-marker { display: none; }
        .status-ready { background: #ecfdf5; color: #059669; }
        .status-repair { background: #fff1f2; color: #e11d48; }
        
        /* สไตล์เพิ่มเติมสำหรับ Lightbox */
        .lightbox-overlay { display: none; position: fixed; top: 0; left: 0; w-width: 100vw; w-height: 100vh; z-index: 1000; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); justify-content: center; items-center: center; opacity: 0; transition: opacity 0.3s ease; }
        .lightbox-overlay.active { display: flex; opacity: 1; }
    </style>
</head>
<body class="p-4 sm:p-6 md:p-8">

    <div class="max-w-4xl mx-auto">
        <div class="mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-3xl md:text-5xl font-black text-blue-900 uppercase italic leading-none tracking-tighter">NCI ENDOSMART</h1>
                <p class="text-xs font-bold text-slate-400 mt-2 uppercase tracking-widest">ศูนย์ส่องกล้องระบบทางเดินอาหาร สถาบันมะเร็งแห่งชาติ</p>
            </div>
            <div id="ready-percent-label" class="bg-blue-600 text-white px-10 py-3 rounded-full font-black text-xl shadow-xl shadow-blue-200">พร้อมใช้ --%</div>
        </div>

        <div class="sticky-header py-4 mb-10 space-y-4">
            <div class="relative">
                <input type="text" id="search-input" placeholder="ค้นหา S/N หรือ รหัสกล้อง..." class="w-full p-5 rounded-2xl border-none shadow-lg outline-none font-bold text-slate-700 bg-white ring-1 ring-slate-100 focus:ring-2 focus:ring-blue-500 transition-all">
            </div>
            <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                <button onclick="setFilter('all')" id="btn-all" class="flex-shrink-0 acc-tab bg-slate-800 text-white shadow-lg">ทั้งหมด (<span id="c-all">0</span>)</button>
                <button onclick="setFilter('ready')" id="btn-ready" class="flex-shrink-0 acc-tab bg-white text-slate-600">พร้อมใช้ (<span id="c-ready">0</span>)</button>
                <button onclick="setFilter('repair')" id="btn-repair" class="flex-shrink-0 acc-tab bg-white text-rose-500">ส่งซ่อม (<span id="c-repair">0</span>)</button>
            </div>
        </div>

        <div id="scope-list" class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-16"></div>

        <div class="card-main p-8 animate-in mb-16 border border-blue-50 bg-white/50">
            <div class="flex items-center gap-3 mb-8">
                <div class="w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center text-white font-black italic shadow-lg shadow-blue-100">W</div>
                <h2 class="text-2xl font-black text-slate-800 uppercase italic">Wash Summary List</h2>
            </div>
            <div class="overflow-x-auto no-scrollbar max-h-[450px] overflow-y-auto rounded-xl">
                <table class="w-full text-left">
                    <thead class="sticky top-0 bg-white shadow-sm z-10 border-b">
                        <tr class="text-[11px] text-slate-400 font-black uppercase italic">
                            <th class="py-4 pr-4">วันที่/เวลา</th>
                            <th class="py-4 pr-4 text-center">รหัส</th>
                            <th class="py-4">Serial Number</th>
                        </tr>
                    </thead>
                    <tbody id="wash-summary-body" class="divide-y divide-slate-50"></tbody>
                </table>
            </div>
        </div>

        <div class="bg-[#0b3d33] text-white p-8 md:p-12 rounded-[3rem] shadow-2xl mb-24 animate-in">
            <div class="mb-10 text-center md:text-left">
                <h2 class="text-3xl font-black italic text-emerald-400 uppercase leading-none tracking-tight">Accessories Catalog</h2>
                <p class="text-emerald-200/40 text-xs font-bold uppercase tracking-[0.3em] mt-2 italic">Medical Inventory</p>
            </div>
            <div id="acc-filter" class="flex gap-2 overflow-x-auto no-scrollbar mb-10 pb-2"></div>
            <div id="accessories-list" class="space-y-6"></div>
        </div>
    </div>

    <!-- โครงสร้างของ Lightbox บล็อกแสดงรูปภาพขนาดใหญ่ -->
    <div id="lightbox" class="lightbox-overlay" onclick="closeLightbox()">
        <div class="relative max-w-3xl max-h-[85vh] p-2 bg-white rounded-3xl shadow-2xl m-4 animate-in" onclick="event.stopPropagation()">
            <button onclick="closeLightbox()" class="absolute -top-3 -right-3 w-10 h-10 bg-rose-500 hover:bg-rose-600 text-white rounded-full font-black text-lg flex items-center justify-center shadow-lg transition-colors z-50">✕</button>
            <div class="overflow-hidden rounded-2xl bg-slate-50 flex items-center justify-center max-h-[75vh]">
                <img id="lightbox-img" src="" class="w-full h-full object-contain">
            </div>
            <p id="lightbox-caption" class="text-center text-slate-800 font-bold mt-3 px-4 text-sm truncate"></p>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxGUOFckc_u-oQqSJZaKLq2zWSn6Ep5jqCx7Q-X-5BeRLGjjo8OTn7KzxkzJwEsr6uI/exec";
        const WASH_LOG_API = "https://script.google.com/macros/s/AKfycbwUY36cqp5ns2dM5LgT0_MqmwH8k5riXXLDEb3JWo7kzfu81rumQ1opt5URik1H2fCC/exec";
        const ACCESSORIES_API = "https://script.google.com/macros/s/AKfycbz4NQzTP25uJWuiIfdewY3gzLLYyGD0KIgfIQIgVMTe3xGQqkCiq4cRl7Z2fCUPf-tF/exec";

        let allScopes = [], washLogs = [], accData = [], currentFilter = 'all', currentAccType = 'ทั้งหมด';

        async function init() {
            try {
                const [sRes, wRes, aRes] = await Promise.all([
                    fetch(API_URL).then(r => r.json()),
                    fetch(WASH_LOG_API).then(r => r.json()),
                    fetch(ACCESSORIES_API).then(r => r.json())
                ]);
                allScopes = sRes.scopes || sRes || [];
                washLogs = wRes.recentWashes || [];
                accData = aRes || [];
                updateUI();
                renderAccFilters();
            } catch (e) { console.error("Data Fetch Error:", e); }
        }

        function updateUI() {
            const search = document.getElementById('search-input').value.toLowerCase().trim();
            
            // 1. จัดการข้อมูลกล้อง
            const readyCount = allScopes.filter(s => (String(s.status)||"").includes("พร้อม")).length;
            const total = allScopes.length;
            
            document.getElementById('ready-percent-label').innerText = `พร้อมใช้ ${total > 0 ? Math.round((readyCount/total)*100) : 0}%`;
            document.getElementById('c-all').innerText = total;
            document.getElementById('c-ready').innerText = readyCount;
            document.getElementById('c-repair').innerText = total - readyCount;

            let filteredScopes = allScopes.filter(s => 
                (String(s.code)||"").toLowerCase().includes(search) || 
                (String(s.serial)||"").toLowerCase().includes(search)
            );
            
            if (currentFilter === 'ready') filteredScopes = filteredScopes.filter(s => (String(s.status)||"").includes("พร้อม"));
            if (currentFilter === 'repair') filteredScopes = filteredScopes.filter(s => !(String(s.status)||"").includes("พร้อม"));

            document.getElementById('scope-list').innerHTML = filteredScopes.map(s => {
                const isReady = (String(s.status)||"").includes("พร้อม");
                return `
                <div class="card-main p-8 animate-in transition-all hover:scale-[1.02]">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <h3 class="text-3xl font-black text-slate-800 tracking-tighter leading-none mb-2 uppercase italic">${s.code}</h3>
                            <span class="px-3 py-1 bg-slate-100 text-slate-400 rounded-lg text-[10px] font-black uppercase italic">${s.brand || 'FUJINON'}</span>
                        </div>
                        <span class="px-4 py-1.5 rounded-full text-[10px] font-black uppercase ${isReady ? 'status-ready' : 'status-repair'}">
                            ● ${isReady ? 'พร้อมใช้' : 'ส่งซ่อม'}
                        </span>
                    </div>
                    <div class="usage-box flex justify-between items-center mb-8">
                        <span class="text-[11px] font-black text-blue-400 uppercase italic">Usage History (L)</span>
                        <div class="flex items-baseline gap-1">
                            <span class="text-4xl font-black text-blue-700 leading-none">${s.usage || 0}</span>
                            <span class="text-[11px] font-bold text-blue-300">ครั้ง</span>
                        </div>
                    </div>
                    ${!isReady ? `
                    <div class="grid grid-cols-2 gap-4 mb-6 pt-4 border-t border-dashed border-slate-100 italic">
                        <div><p class="text-[9px] font-black text-slate-300 uppercase">วันที่ส่งซ่อม</p><p class="text-xs font-bold text-slate-600">${s.sentDate || '-'}</p></div>
                        <div><p class="text-[9px] font-black text-blue-400 uppercase">วันที่คืน</p><p class="text-xs font-bold text-blue-600">${s.returnDate || '-'}</p></div>
                    </div>` : ''}
                    <div class="mt-auto pt-6 border-t border-slate-50 flex justify-between items-center">
                        <div>
                            <p class="text-[9px] font-black text-slate-300 uppercase italic mb-1 tracking-widest">Serial Number</p>
                            <p class="text-xl font-black text-slate-800 tracking-tight leading-none">${s.serial || '-'}</p>
                        </div>
                        <div class="w-4 h-4 ${isReady ? 'bg-emerald-400 shadow-[0_0_15px_#4ade80]' : 'bg-rose-400'} rounded-full animate-pulse"></div>
                    </div>
                </div>`;
            }).join('');

            // 2. จัดการข้อมูลประวัติการล้าง
            document.getElementById('wash-summary-body').innerHTML = washLogs.map(w => `
                <tr class="text-[12px] font-bold text-slate-500 hover:bg-slate-50/50 transition-colors">
                    <td class="py-5 pr-4 italic">${w.date}</td>
                    <td class="py-5 text-center"><span class="bg-blue-50 text-blue-600 px-4 py-1.5 rounded-xl uppercase italic font-black text-[11px]">${w.code}</span></td>
                    <td class="py-5 text-slate-800 font-black tracking-tight">${w.sn}</td>
                </tr>
            `).join('');

            // 3. จัดการข้อมูล Accessories (ขยายขนาดรูปและเพิ่มฟังก์ชันคลิกส่องรูปใหญ่)
            let filteredAcc = accData.filter(i => 
                (String(i.name)||"").toLowerCase().includes(search) || 
                (String(i.itemCode)||"").toLowerCase().includes(search)
            );
            if (currentAccType !== 'ทั้งหมด') filteredAcc = filteredAcc.filter(i => i.procedure === currentAccType);
            
            document.getElementById('accessories-list').innerHTML = filteredAcc.map(i => {
                const imgSource = i.imageURL || '📦';
                const itemName = (i.name || 'N/A').replace(/"/g, '&quot;'); // กัน Error สตริงหลุด
                return `
                <details class="group bg-white/95 rounded-[2.5rem] overflow-hidden border border-emerald-900/10 shadow-xl animate-in transition-all">
                    <summary class="p-6 flex items-center justify-between cursor-pointer list-none">
                        <div class="flex items-center gap-6">
                            <!-- ขยายกรอบรูปภาพเป็น w-20 h-20 บนมือถือ และ w-28 h-28 บนจอใหญ่ พร้อมใส่เอฟเฟกต์แว่นขยาย -->
                            <div class="relative w-20 h-20 sm:w-28 sm:h-28 rounded-2xl bg-white flex items-center justify-center p-1 border border-slate-100 shadow-md overflow-hidden group/img flex-shrink-0" 
                                 onclick="openLightbox('${imgSource}', '${itemName}'); event.stopPropagation();">
                                <img src="${imgSource}" class="w-full h-full object-contain transition-transform duration-200 group-hover/img:scale-110" onerror="this.src='https://via.placeholder.com/200?text=📦'">
                                <div class="absolute inset-0 bg-black/10 opacity-0 group-hover/img:opacity-100 flex items-center justify-center transition-opacity">
                                    <span class="text-white bg-slate-900/60 rounded-full p-1.5 text-xs">🔍</span>
                                </div>
                            </div>
                            <div>
                                <h4 class="text-base font-black text-slate-800 leading-tight">${i.name || 'N/A'}</h4>
                                <p class="text-[10px] font-bold text-emerald-600 uppercase mt-1 tracking-[0.2em] italic">${i.itemCode || '-'}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-6">
                            <div class="text-right">
                                <p class="text-3xl font-black ${i.qty > 5 ? 'text-emerald-600' : 'text-rose-600'} leading-none">${i.qty || 0}</p>
                                <p class="text-[9px] font-bold text-slate-400 uppercase mt-1 italic">Stock</p>
                            </div>
                            <div class="text-emerald-200 transition-transform group-open:rotate-180 text-xs">▼</div>
                        </div>
                    </summary>
                    <div class="px-8 pb-10 border-t border-slate-50 bg-slate-50/50">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mt-8">
                            <div>
                                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3 italic">📝 Specifications / Size</p>
                                <div class="text-sm font-bold text-slate-700 bg-white p-5 rounded-3xl border border-slate-100 shadow-sm leading-relaxed italic">
                                    ${i.specs || 'ไม่มีข้อมูลรายละเอียด'}
                                </div>
                            </div>
                            <div>
                                <p class="text-[10px] font-black text-emerald-500 uppercase tracking-widest mb-3 italic">💡 Indication (ข้อบ่งใช้)</p>
                                <div class="text-sm font-bold text-slate-700 bg-emerald-50/30 p-5 rounded-3xl border border-emerald-100/30 shadow-sm leading-relaxed italic">
                                    ${i.indication || 'ไม่มีข้อมูลข้อบ่งใช้'}
                                </div>
                            </div>
                        </div>
                        <div class="mt-8">
                            <span class="px-5 py-2 bg-slate-800 text-white rounded-full text-[10px] font-black uppercase italic tracking-[0.1em]">
                                Procedure: ${i.procedure || '-'}
                            </span>
                        </div>
                    </div>
                </details>`;
            }).join('');
        }

        function renderAccFilters() {
            const container = document.getElementById('acc-filter');
            const types = ['ทั้งหมด', ...new Set(accData.map(i => i.procedure).filter(p => p))];
            container.innerHTML = types.map(t => `<button onclick="filterAccType('${t}', this)" class="acc-tab whitespace-nowrap ${t === currentAccType ? 'bg-emerald-400 text-[#0b3d33]' : 'bg-transparent text-emerald-100'}">${t}</button>`).join('');
        }

        function filterAccType(type, btn) { currentAccType = type; renderAccFilters(); updateUI(); }
        
        function setFilter(f) {
            currentFilter = f;
            ['all', 'ready', 'repair'].forEach(t => {
                const btn = document.getElementById('btn-' + t);
                btn.className = t === f ? "flex-shrink-0 acc-tab bg-slate-800 text-white shadow-lg" : "flex-shrink-0 acc-tab bg-white text-slate-600";
            });
            updateUI();
        }

        // ฟังก์ชันระบบเจาะจงดูรูปภาพใหญ่ (Lightbox Control)
        function openLightbox(src, name) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            const lightboxCaption = document.getElementById('lightbox-caption');
            
            lightboxImg.src = src;
            lightboxCaption.innerText = name;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden'; // ล็อกการสกรอลล์ของหน้าเว็บหลักเบื้องหลัง
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('active');
            document.body.style.overflow = ''; // คืนค่าการสกรอลล์
        }

        document.getElementById('search-input').addEventListener('input', updateUI);
        init(); setInterval(init, 30000);
    </script>
</body>
</html>
