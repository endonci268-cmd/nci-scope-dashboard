<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxL8VnqCWO-3YuNsMrz5pJ012rLTKTD1gQA2zu8pgENMDQ34YHI8Diyh9NAoVEjskM/exec";
    const WASH_LOG_API = "https://script.google.com/macros/s/AKfycbwUY36cqp5ns2dM5LgT0_MqmwH8k5riXXLDEb3JWo7kzfu81rumQ1opt5URik1H2fCC/exec";
    const ACCESSORIES_API = "https://script.google.com/macros/s/AKfycbz4NQzTP25uJWuiIfdewY3gzLLYyGD0KIgfIQIgVMTe3xGQqkCiq4cRl7Z2fCUPf-tF/exec";

    let allScopes = [],
        washLogs = [],
        accData = [],
        currentFilter = 'all',
        currentAccType = 'ทั้งหมด';

    async function init() {
        try {

            const [sRes, wRes, aRes] = await Promise.all([
                fetch(API_URL).then(r => r.json()),
                fetch(WASH_LOG_API).then(r => r.json()),
                fetch(ACCESSORIES_API).then(r => r.json())
            ]);

            allScopes = sRes.scopes || sRes || [];

            // ✅ รองรับทั้ง array และ recentWashes
            washLogs = Array.isArray(wRes)
                ? wRes
                : (wRes.recentWashes || []);

            accData = aRes || [];

            console.log("Wash Logs:", washLogs);

            updateUI();
            renderAccFilters();

        } catch (e) {
            console.error("Init Error:", e);
        }
    }

    function updateUI() {

        const search = document.getElementById('search-input')
            .value
            .toLowerCase()
            .trim();

        const accSearch = document.getElementById('acc-search')
            .value
            .toLowerCase()
            .trim();

        // =========================
        // นับจำนวนการใช้งานตาม Serial Number
        // =========================

        const usageBySN = {};

        washLogs.forEach(w => {

            // ✅ รองรับชื่อ field จริงจาก Google Sheet
            const sn = (
                w["Serial Number"] ||
                w.sn ||
                w.serial ||
                ""
            )
            .toString()
            .trim()
            .toUpperCase();

            if (sn) {
                usageBySN[sn] = (usageBySN[sn] || 0) + 1;
            }
        });

        console.log("Usage By SN:", usageBySN);

        // =========================
        // Summary Count
        // =========================

        const total = allScopes.length;

        const readyCount = allScopes.filter(s =>
            (s.status || "").includes("พร้อม")
        ).length;

        document.getElementById('ready-percent-label').innerText =
            `พร้อมใช้ ${total > 0 ? Math.round((readyCount / total) * 100) : 0}%`;

        document.getElementById('c-all').innerText = total;
        document.getElementById('c-ready').innerText = readyCount;
        document.getElementById('c-repair').innerText = total - readyCount;

        // =========================
        // Filter Scope
        // =========================

        let filteredScopes = allScopes.filter(s =>

            (s.code || "")
            .toLowerCase()
            .includes(search)

            ||

            (s.serial || "")
            .toLowerCase()
            .includes(search)

        );

        if (currentFilter === 'ready') {

            filteredScopes = filteredScopes.filter(s =>
                (s.status || "").includes("พร้อม")
            );
        }

        if (currentFilter === 'repair') {

            filteredScopes = filteredScopes.filter(s =>
                !(s.status || "").includes("พร้อม")
            );
        }

        // =========================
        // Render Scope Cards
        // =========================

        document.getElementById('scope-list').innerHTML =
            filteredScopes.map(s => {

                const isReady =
                    (s.status || "").includes("พร้อม");

                const snKey = (
                    s.serial ||
                    s["Serial Number"] ||
                    ""
                )
                .toString()
                .trim()
                .toUpperCase();

                const usageCount =
                    usageBySN[snKey] || 0;

                return `
                <div class="card-main p-6 md:p-8 animate-in flex flex-col h-full border border-slate-50">

                    <div class="flex justify-between items-start mb-4">

                        <div>
                            <h3 class="text-3xl font-black text-slate-800 tracking-tighter leading-none mb-1 uppercase italic">
                                ${s.code || '-'}
                            </h3>

                            <span class="px-2 py-0.5 bg-slate-100 text-slate-400 rounded text-[9px] font-black uppercase italic">
                                ${s.brand || 'FUJINON'}
                            </span>
                        </div>

                        <span class="px-3 py-1 rounded-full text-[9px] font-black uppercase
                            ${isReady
                                ? 'bg-emerald-50 text-emerald-600'
                                : 'bg-rose-50 text-rose-600'}">

                            ● ${isReady ? 'พร้อมใช้' : 'ส่งซ่อม'}
                        </span>
                    </div>

                    <div class="usage-box flex justify-between items-center mb-6 shadow-sm border-blue-50">

                        <span class="text-[10px] font-black text-blue-400 uppercase italic leading-none tracking-widest">
                            Usage History
                        </span>

                        <div class="flex items-baseline gap-1">

                            <span class="text-4xl font-black text-blue-700 leading-none">
                                ${usageCount}
                            </span>

                            <span class="text-[10px] font-bold text-blue-300">
                                ครั้ง
                            </span>
                        </div>
                    </div>

                    <div class="mt-auto pt-6 border-t border-slate-50 flex justify-between items-center">

                        <div>
                            <p class="text-[8px] font-black text-slate-300 uppercase italic leading-none mb-1">
                                Serial Number
                            </p>

                            <p class="text-xl font-black text-slate-800 tracking-tight leading-none">
                                ${s.serial || '-'}
                            </p>
                        </div>

                        <div class="w-3 h-3
                            ${isReady
                                ? 'bg-emerald-400 shadow-[0_0_10px_#4ade80]'
                                : 'bg-rose-400'}
                            rounded-full">
                        </div>
                    </div>

                </div>
                `;
            }).join('');

        // =========================
        // Render Wash Summary
        // =========================

        const summaryTableBody =
            document.getElementById('daily-summary-body');

        summaryTableBody.innerHTML =
            washLogs.map(w => `

                <tr class="text-[11px] font-bold text-slate-600 border-b border-slate-50">

                    <td class="py-4 text-slate-400 italic">
                        ${w.date || w["วันที่ล้าง"] || '-'}
                    </td>

                    <td class="py-4">

                        <span class="bg-blue-50 text-blue-600 px-3 py-1 rounded-lg uppercase italic font-black text-[10px]">
                            ${w.code || w["รหัสกล้อง"] || '-'}
                        </span>
                    </td>

                    <td class="py-4 text-slate-800 font-black">
                        ${w["Serial Number"] || w.sn || '-'}
                    </td>

                </tr>

            `).join('');

        // =========================
        // Accessories
        // =========================

        let filteredAcc = accData.filter(i =>

            (i.name || "")
            .toLowerCase()
            .includes(accSearch)

            ||

            (i.itemCode || "")
            .toLowerCase()
            .includes(accSearch)

        );

        if (currentAccType !== 'ทั้งหมด') {

            filteredAcc = filteredAcc.filter(i =>
                i.procedure === currentAccType
            );
        }

        document.getElementById('accessories-list').innerHTML =
            filteredAcc.map(i => `

                <details class="group bg-white/95 rounded-[1.5rem] overflow-hidden border border-emerald-900/10 shadow-lg animate-in">

                    <summary class="p-5 flex items-center justify-between cursor-pointer list-none">

                        <div class="flex items-center gap-4">

                            <div class="w-12 h-12 rounded-xl bg-slate-50 flex items-center justify-center p-1 border border-slate-100 shadow-inner overflow-hidden">

                                <img src="${i.imageURL || 'https://via.placeholder.com/100?text=📦'}"
                                     class="w-full h-full object-contain">
                            </div>

                            <div>

                                <h4 class="text-sm font-bold text-slate-800 leading-tight">
                                    ${i.name || 'N/A'}
                                </h4>

                                <p class="text-[10px] font-bold text-emerald-600/50 uppercase italic leading-none mt-1">
                                    ${i.procedure || '-'}
                                </p>

                            </div>
                        </div>

                        <div class="flex items-center gap-4">

                            <div class="text-right">

                                <p class="text-[9px] font-bold text-slate-400 uppercase italic leading-none">
                                    Stock
                                </p>

                                <p class="text-lg font-black ${i.qty > 5 ? 'text-emerald-600' : 'text-rose-600'}">
                                    ${i.qty || 0}
                                </p>

                            </div>

                            <div class="text-slate-300 transition-transform group-open:rotate-180 text-xs">
                                ▼
                            </div>

                        </div>
                    </summary>

                    <div class="px-5 pb-6 animate-in border-t border-slate-50 bg-slate-50/50">

                        <div class="flex flex-col md:flex-row gap-6 mt-4">

                            <div class="w-full md:w-56 h-56 rounded-3xl bg-white border border-slate-200 flex items-center justify-center p-4 shadow-sm">

                                <img src="${i.imageURL || 'https://via.placeholder.com/100?text=📦'}"
                                     class="max-w-full max-h-full object-contain">

                            </div>

                            <div class="flex-grow space-y-4">

                                <div>
                                    <p class="text-[9px] font-bold text-slate-400 uppercase italic tracking-widest leading-none mb-1">
                                        Product Code
                                    </p>

                                    <p class="text-sm font-black text-slate-800 uppercase leading-none">
                                        ${i.itemCode || '-'}
                                    </p>
                                </div>

                                <div>
                                    <p class="text-[9px] font-bold text-slate-400 uppercase italic tracking-widest leading-none mb-1">
                                        Specifications / Size
                                    </p>

                                    <p class="text-sm font-bold text-slate-600 leading-none">
                                        ${i.specs || '-'}
                                    </p>
                                </div>

                                <div class="p-4 bg-emerald-50 rounded-2xl border border-emerald-100 shadow-inner">

                                    <p class="text-[9px] font-bold text-emerald-500 uppercase italic mb-1 tracking-widest">
                                        Indication (ข้อบ่งใช้):
                                    </p>

                                    <p class="text-sm font-bold text-slate-700 leading-relaxed">
                                        ${i.indication || '-'}
                                    </p>

                                </div>

                            </div>
                        </div>
                    </div>
                </details>

            `).join('');
    }

    function renderAccFilters() {

        const container =
            document.getElementById('acc-filter');

        const types = [
            'ทั้งหมด',
            ...new Set(
                accData
                    .map(i => i.procedure)
                    .filter(p => p)
            )
        ];

        container.innerHTML =
            types.map(t => `

                <button
                    onclick="filterAccType('${t}', this)"
                    class="acc-tab whitespace-nowrap
                    ${t === currentAccType
                        ? 'bg-emerald-400 text-[#0b3d33]'
                        : 'bg-[#144d44] text-emerald-200'}">

                    ${t}

                </button>

            `).join('');
    }

    function filterAccType(type, btn) {

        currentAccType = type;

        renderAccFilters();
        updateUI();
    }

    function setFilter(f) {

        currentFilter = f;

        ['all', 'ready', 'repair'].forEach(t => {

            const btn =
                document.getElementById('btn-' + t);

            btn.className =
                t === f

                ? "flex-shrink-0 px-6 py-2.5 rounded-xl bg-slate-800 text-white font-bold text-xs uppercase shadow-md"

                : "flex-shrink-0 px-6 py-2.5 rounded-xl bg-white text-slate-500 font-bold text-xs border border-slate-200 uppercase shadow-sm";
        });

        updateUI();
    }

    document
        .getElementById('search-input')
        .addEventListener('input', updateUI);

    init();

    setInterval(init, 30000);
</script>
