<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NCI SCOPETAGLINE - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; }
        .card { transition: all 0.25s ease; border-radius: 2.5rem; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,0.05); }
        .progress-bar-fill { transition: width 1.2s cubic-bezier(0.65, 0, 0.35, 1); }
        .filter-btn.active { background-color: #059669; color: white; border-color: #059669; box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="p-4 md:p-8 text-slate-800">

    <div class="max-w-6xl mx-auto">
        <div class="mb-10 flex flex-col md:flex-row md:items-center justify-between gap-6">
            <div>
                <h1 class="text-4xl font-black text-blue-900 tracking-tight mb-1">NCI SCOPETAGLINE</h1>
                <div class="flex items-center gap-2 text-slate-500">
                    <span class="w-2 h-2 bg-emerald-500 rounded-full animate-ping"></span>
                    <p class="text-sm font-medium">ระบบดิจิทัลจัดการสถานะกล้องและอุปกรณ์ • สถาบันมะเร็งแห่งชาติ</p>
                </div>
            </div>
            <div id="last-update" class="text-[12px] font-bold text-slate-400 bg-white px-6 py-2 rounded-full shadow-sm border border-slate-100 italic">
                กำลังเชื่อมต่อระบบ...
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="md:col-span-2 bg-white rounded-[3rem] p-8 shadow-sm border border-slate-100 relative overflow-hidden">
                <div class="relative z-10">
                    <div class="flex justify-between items-center mb-6">
                        <span class="font-bold text-slate-400 uppercase tracking-widest text-xs">Overall Availability</span>
                        <span id="availability-percent" class="text-4xl font-black text-blue-600 tracking-tighter">0%</span>
                    </div>
                    <div class="w-full bg-slate-100 rounded-full h-5 overflow-hidden p-1">
                        <div id="progress-fill" class="progress-bar-fill h-full bg-blue-600 rounded-full shadow-sm" style="width: 0%"></div>
                    </div>
                </div>
            </div>
            <div class="bg-blue-950 rounded-[3rem] p-8 shadow-xl text-white flex flex-col justify-center border-b-8 border-blue-700 text-center">
                <p class="text-blue-300 text-[10px] font-bold uppercase tracking-[0.2em] mb-2">Total Inventory</p>
                <h2 class="text-6xl font-black"><span id="count-all">0</span>ตัว</h2>
            </div>
        </div>

        <div class="flex flex-col md:flex-row gap-4 mb-10">
            <input type="text" id="search-input" placeholder="ค้นหาด้วยรหัสกล้อง หรือยี่ห้ออุปกรณ์..." class="flex-grow p-5 rounded-3xl border-none shadow-sm outline-none bg-white font-medium">
            <div class="flex gap-2 p-2 bg-white rounded-3xl shadow-sm border border-slate-100 overflow-x-auto no-scrollbar">
                <button onclick="filterData('all')" id="btn-all" class="px-8 py-3 rounded-2xl bg-blue-600 text-white font-bold text-sm shadow-lg">ทั้งหมด</button>
                <button onclick="filterData('ready')" id="btn-ready" class="px-8 py-3 rounded-2xl text-slate-400 font-bold text-sm">พร้อมใช้ <span id="count-ready" class="ml-1 opacity-40">0</span></button>
                <button onclick="filterData('repair')" id="btn-repair" class="px-8 py-3 rounded-2xl text-slate-400 font-bold text-sm">ส่งซ่อม <span id="count-repair" class="ml-1 opacity-40">0</span></button>
            </div>
        </div>

        <div id="scope-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mb-16"></div>

        <div class="bg-white rounded-[3.5rem] p-10 shadow-sm border border-slate-100 mb-16">
            <h2 class="text-2xl font-black text-slate-800 mb-10">Wash Log History</h2>
            <div class="overflow-x-auto no-scrollbar">
                <table class="w-full text-left border-separate border-spacing-y-4">
                    <tbody id="wash-log-table-body"></tbody>
                </table>
            </div>
        </div>

        <div class="bg-white rounded-[3.5rem] p-10 shadow-sm border border-slate-100 mb-24">
            <div class="flex flex-col md:flex-row items-center justify-between mb-12 gap-6">
                <h2 class="text-2xl font-black text-slate-800">Accessories Catalog</h2>
                <div id="filter-buttons" class="flex gap-2 overflow-x-auto no-scrollbar pb-2"></div>
            </div>
            <div id="accessories-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-8"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxL8VnqCWO-3YuNsMrz5pJ012rLTKTD1gQA2zu8pgENMDQ34YHI8Diyh9NAoVEjskM/exec";
        const WASH_LOG_API = "https://script.google.com/macros/s/AKfycbwUY36cqp5ns2dM5LgT0_MqmwH8k5riXXLDEb3JWo7kzfu81rumQ1opt5URik1H2fCC/exec";
        const ACCESSORIES_API = "https://script.google.com/macros/s/AKfycbyRc5C0pXwwIjA8_EIUyQueh40Myh9LGs6Zhc_kQYHv3GXnoJBn0ZI-fCv7IdhSJvpj/exec";

        let scopeData = [], usageStats = {}, recentWashes = [], accessoriesData = [], currentFilter = 'all';

        async function fetchAllData() {
            try {
                const [scopeRes, washRes] = await Promise.all([
                    fetch(API_URL).then(res => res.json()),
                    fetch(WASH_LOG_API).then(res => res.json())
                ]);
                if (scopeRes && scopeRes.scopes) {
                    scopeData = scopeRes.scopes;
                    usageStats = washRes.usageStats || {};
                    recentWashes = washRes.recentWashes || [];
                    updateStats(); renderUI(); renderHistoryTable();
                }
            } catch (e) { console.error(e); }

            try {
                const accRes = await fetch(ACCESSORIES_API).then(res => res.json());
                if (accRes) {
                    accessoriesData = accRes.filter(item => item.itemCode);
                    setupFilters(accessoriesData);
                    displayAccessories(accessoriesData);
                }
            } catch (e) { console.error(e); }
            document.getElementById('last-update').innerText = `Updated: ${new Date().toLocaleTimeString('th-TH')}`;
        }

        function updateStats() {
            const total = scopeData.length, ready = scopeData.filter(s => s.status.includes('พร้อม')).length;
            const percent = total > 0 ? Math.round((ready / total) * 100) : 0;
            document.getElementById('count-all').innerText = total;
            document.getElementById('count-ready').innerText = ready;
            document.getElementById('count-repair').innerText = total - ready;
            document.getElementById('availability-percent').innerText = `${percent}%`;
            document.getElementById('progress-fill').style.width = `${percent}%`;
        }

        function renderUI() {
            const term = document.getElementById('search-input').value.toLowerCase();
            let filtered = scopeData.filter(s => s.code.toLowerCase().includes(term));
            if (currentFilter === 'ready') filtered = filtered.filter(s => s.status.includes('พร้อม'));
            if (currentFilter === 'repair') filtered = filtered.filter(s => !s.status.includes('พร้อม'));
            document.getElementById('scope-grid').innerHTML = filtered.map(scope => `
                <div class="card bg-white p-8 border border-slate-100 shadow-sm">
                    <h3 class="text-3xl font-black text-slate-800 mb-2">${scope.code}</h3>
                    <p class="text-sm font-bold text-slate-400 mb-6">${scope.brand} • ${scope.diameter}mm</p>
                    <div class="bg-blue-50/40 p-5 rounded-3xl flex justify-between items-center">
                        <span class="text-4xl font-black text-blue-800">${usageStats[scope.code] || 0}</span>
                    </div>
                </div>`).join('');
        }

        function renderHistoryTable() {
            document.getElementById('wash-log-table-body').innerHTML = recentWashes.map(w => `
                <tr class="bg-white"><td class="px-6 py-5 rounded-l-3xl">${w.date}</td><td class="text-center font-black">${w.code}</td><td class="rounded-r-3xl font-black">${w.sn}</td></tr>`).join('');
        }

        function setupFilters(data) {
            const procedures = ['ทั้งหมด', ...new Set(data.map(item => item.procedure))];
            document.getElementById('filter-buttons').innerHTML = procedures.map(proc => `<button onclick="filterByProcedure('${proc}', this)" class="filter-btn px-6 py-3 rounded-2xl border font-black uppercase text-[10px]">${proc}</button>`).join('');
            document.querySelector('.filter-btn').classList.add('active');
        }

        function displayAccessories(items) {
            document.getElementById('accessories-grid').innerHTML = items.map(item => `
                <div class="bg-white p-5 rounded-[2.5rem] shadow-sm border border-slate-50">
                    <img src="${item.imageURL || 'https://via.placeholder.com/150'}" class="w-full aspect-square object-contain mb-5">
                    <h4 class="font-black text-[13px] uppercase">${item.name}</h4>
                    <div class="flex justify-between mt-4 bg-slate-50 p-3 rounded-2xl">
                        <span class="font-black text-slate-400 text-[10px]">${item.itemCode}</span>
                        <span class="font-black text-emerald-600 text-[10px]">Qty: ${item.qty}</span>
                    </div>
                </div>`).join('');
        }

        function filterByProcedure(proc, btnEl) {
            displayAccessories(proc === 'ทั้งหมด' ? accessoriesData : accessoriesData.filter(i => i.procedure === proc));
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
        }

        function filterData(t) { currentFilter = t; renderUI(); }
        document.getElementById('search-input').addEventListener('input', renderUI);
        fetchAllData(); setInterval(fetchAllData, 30000);
    </script>
</body>
</html>
