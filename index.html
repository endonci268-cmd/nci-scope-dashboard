<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NCI SCOPE - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f1f5f9; }
        .card { transition: all 0.2s ease; border-radius: 2rem; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .progress-bar-fill { transition: width 1s ease-in-out; }
    </style>
</head>
<body class="p-4 md:p-8 text-slate-800">

    <div class="max-w-5xl mx-auto">
        <div class="mb-8 flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div>
                <h1 class="text-3xl font-bold text-blue-900 tracking-tight">NCI SCOPETAGLINE</h1>
                <p class="text-slate-500 text-sm">ระบบจัดการสถานะกล้องส่องตรวจ • สถาบันมะเร็งแห่งชาติ</p>
            </div>
            <div id="last-update" class="text-[12px] text-slate-400 bg-white px-4 py-1.5 rounded-full shadow-sm border border-slate-100 italic">
                กำลังโหลด...
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="md:col-span-2 bg-white rounded-[2rem] p-6 shadow-sm border border-slate-100">
                <div class="flex justify-between items-center mb-4">
                    <span class="font-semibold text-slate-600 flex items-center gap-2">อัตราความพร้อมใช้งาน</span>
                    <span id="availability-percent" class="text-3xl font-bold text-blue-600">0%</span>
                </div>
                <div class="w-full bg-slate-100 rounded-full h-4 overflow-hidden">
                    <div id="progress-fill" class="progress-bar-fill h-full bg-blue-600" style="width: 0%"></div>
                </div>
            </div>
            <div class="bg-blue-950 rounded-[2rem] p-6 shadow-xl text-white flex flex-col justify-center border-b-4 border-blue-700 text-center">
                <p class="text-blue-300 text-xs uppercase mb-1">กล้องทั้งหมด</p>
                <h2 class="text-5xl font-black"><span id="count-all">0</span> <small class="text-lg font-light opacity-50">ตัว</small></h2>
            </div>
        </div>

        <div class="flex flex-col md:flex-row gap-4 mb-8">
            <div class="relative flex-grow">
                <input type="text" id="search-input" placeholder="ค้นหารหัส หรือยี่ห้อ..." 
                    class="w-full p-4 pl-12 rounded-2xl border-none shadow-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white text-slate-700 transition-all">
                <svg class="w-6 h-6 absolute left-4 top-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            <div class="flex gap-2 p-1.5 bg-white rounded-2xl shadow-sm border border-slate-100">
                <button onclick="filterData('all')" id="btn-all" class="px-6 py-2.5 rounded-xl bg-blue-600 text-white font-medium text-sm transition-all shadow-md">ทั้งหมด</button>
                <button onclick="filterData('ready')" id="btn-ready" class="px-6 py-2.5 rounded-xl text-slate-500 hover:bg-slate-50 font-medium text-sm transition-all">พร้อมใช้ <span id="count-ready" class="ml-1 opacity-50">0</span></button>
                <button onclick="filterData('repair')" id="btn-repair" class="px-6 py-2.5 rounded-xl text-slate-500 hover:bg-slate-50 font-medium text-sm transition-all">ส่งซ่อม <span id="count-repair" class="ml-1 opacity-50">0</span></button>
            </div>
        </div>

        <div id="scope-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12">
            </div>

        <div class="bg-white rounded-[2.5rem] p-8 shadow-sm border border-slate-100 mb-20">
            <div class="flex items-center gap-3 mb-8">
                <div class="p-3 bg-blue-100 rounded-2xl text-blue-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <h2 class="text-2xl font-bold text-slate-800 tracking-tight">ประวัติการล้างล่าสุด (10 เคส)</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="text-slate-400 text-[11px] uppercase tracking-[0.2em] border-b border-slate-50">
                            <th class="pb-5 font-semibold">วันเวลาที่ลงข้อมูล</th>
                            <th class="pb-5 font-semibold text-center">รหัสกล้อง</th>
                            <th class="pb-5 font-semibold">เลขซีเรียล (Serial Number)</th>
                        </tr>
                    </thead>
                    <tbody id="wash-log-table-body" class="divide-y divide-slate-50"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxL8VnqCWO-3YuNsMrz5pJ012rLTKTD1gQA2zu8pgENMDQ34YHI8Diyh9NAoVEjskM/exec";
        const WASH_LOG_API = "https://script.google.com/macros/s/AKfycbwUY36cqp5ns2dM5LgT0_MqmwH8k5riXXLDEb3JWo7kzfu81rumQ1opt5URik1H2fCC/exec";

        let scopeData = [];
        let usageStats = {};
        let recentWashes = [];
        let currentFilter = 'all';

        async function fetchData() {
            try {
                const [scopeRes, washRes] = await Promise.all([
                    fetch(API_URL).then(res => res.json()),
                    fetch(WASH_LOG_API).then(res => res.json())
                ]);

                if (scopeRes && scopeRes.scopes) {
                    scopeData = scopeRes.scopes;
                    usageStats = washRes.usageStats || {};
                    recentWashes = washRes.recentWashes || [];
                    updateStats();
                    renderUI();
                    renderHistoryTable();
                    document.getElementById('last-update').innerText = `อัปเดตล่าสุด • ${new Date().toLocaleTimeString('th-TH')}`;
                }
            } catch (error) {
                console.error("Fetch Error:", error);
                document.getElementById('last-update').innerText = "⚠️ การเชื่อมต่อล้มเหลว";
            }
        }

        function updateStats() {
            const total = scopeData.length;
            const ready = scopeData.filter(s => (s.status || "").includes('พร้อม')).length;
            const repair = total - ready;
            const percent = total > 0 ? Math.round((ready / total) * 100) : 0;
            document.getElementById('count-all').innerText = total;
            document.getElementById('count-ready').innerText = ready;
            document.getElementById('count-repair').innerText = repair;
            document.getElementById('availability-percent').innerText = `${percent}%`;
            document.getElementById('progress-fill').style.width = `${percent}%`;
        }

        function filterData(type) {
            currentFilter = type;
            renderUI();
            const btns = { all: 'btn-all', ready: 'btn-ready', repair: 'btn-repair' };
            Object.keys(btns).forEach(key => {
                const el = document.getElementById(btns[key]);
                if (key === type) {
                    el.className = "px-6 py-2.5 rounded-xl bg-blue-600 text-white font-medium text-sm shadow-md transition-all";
                } else {
                    el.className = "px-6 py-2.5 rounded-xl text-slate-500 hover:bg-slate-50 font-medium text-sm transition-all";
                }
            });
        }

        function renderUI() {
            const term = document.getElementById('search-input').value.toLowerCase();
            let filtered = scopeData.filter(s => (s.code||"").toLowerCase().includes(term) || (s.brand||"").toLowerCase().includes(term));
            
            if (currentFilter === 'ready') filtered = filtered.filter(s => (s.status||"").includes('พร้อม'));
            if (currentFilter === 'repair') filtered = filtered.filter(s => !(s.status||"").includes('พร้อม'));

            const grid = document.getElementById('scope-grid');
            if (!filtered.length) {
                grid.innerHTML = `<p class="col-span-full text-center py-20 text-slate-400 italic">ไม่พบข้อมูล</p>`;
                return;
            }

            grid.innerHTML = filtered.map(scope => {
                // ปรับเงื่อนไขการเช็คสถานะให้ยืดหยุ่นขึ้น
                const isReady = (scope.status || "").trim() === "พร้อมใช้" || (scope.status || "").includes("พร้อม");
                const count = usageStats[scope.code] || 0; 
                
                return `
                    <div class="card bg-white p-6 shadow-sm border border-slate-200 flex flex-col justify-between h-full">
                        <div>
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <h3 class="text-2xl font-black text-slate-800 leading-none mb-1">${scope.code || '-'}</h3>
                                    <span class="text-[10px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded font-bold uppercase tracking-wider italic">${scope.brand || '-'}</span>
                                </div>
                                <span class="px-3 py-1 rounded-full text-[10px] font-black uppercase ${isReady ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}">
                                    ${scope.status || 'Unknown'}
                                </span>
                            </div>
                            
                            <p class="text-sm text-slate-400 mb-4 font-medium">${scope.type || '-'} • ${scope.diameter || '-'}mm</p>
                            
                            <div class="bg-blue-50/50 rounded-2xl p-4 mb-4 border border-blue-100/30 flex justify-between items-center">
                                <span class="text-[11px] font-bold text-blue-400 uppercase">Usage History</span>
                                <span class="text-3xl font-black text-blue-700">${count} <small class="text-xs font-normal opacity-50">ครั้ง</small></span>
                            </div>

                            ${!isReady ? `
                                <div class="bg-red-50 p-4 rounded-2xl border border-red-100 mb-4 shadow-inner">
                                    <div class="flex justify-between items-center mb-1">
                                        <span class="text-[10px] font-bold text-red-400 uppercase">วันที่ส่ง:</span>
                                        <span class="text-sm font-bold text-red-700">${scope.sentDate || '-'}</span>
                                    </div>
                                    <div class="flex justify-between items-center">
                                        <span class="text-[10px] font-bold text-red-400 uppercase">กำหนดคืน:</span>
                                        <span class="text-sm font-bold text-red-700">${scope.returnDate || '-'}</span>
                                    </div>
                                </div>
                            ` : ''}
                        </div>

                        <div class="mt-auto pt-4 border-t border-slate-100 flex justify-between items-center">
                            <div>
                                <p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest">Serial Number</p>
                                <p class="text-lg font-black text-slate-700 tracking-tight">${scope.serial || '-'}</p>
                            </div>
                            <div class="w-3 h-3 ${isReady ? 'bg-green-500 animate-pulse' : 'bg-red-500'} rounded-full"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderHistoryTable() {
            const tbody = document.getElementById('wash-log-table-body');
            if (!recentWashes.length) {
                tbody.innerHTML = `<tr><td colspan="3" class="py-12 text-center text-slate-300 italic font-light">ยังไม่มีข้อมูลประวัติ</td></tr>`;
                return;
            }
            tbody.innerHTML = recentWashes.map(w => `
                <tr class="hover:bg-slate-50 transition-colors group">
                    <td class="py-5 text-sm font-medium text-slate-500">${w.date}</td>
                    <td class="py-5 text-center">
                        <span class="px-4 py-1.5 bg-blue-50 text-blue-600 rounded-xl font-bold text-base shadow-sm group-hover:bg-blue-600 group-hover:text-white transition-all italic">
                            ${w.code}
                        </span>
                    </td>
                    <td class="py-5 text-lg font-black text-slate-700 tracking-tight">${w.sn}</td>
                </tr>
            `).join('');
        }

        document.getElementById('search-input').addEventListener('input', renderUI);
        fetchData();
        setInterval(fetchData, 60000);
    </script>
</body>
</html>
