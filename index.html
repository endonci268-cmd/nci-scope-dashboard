<script>
    // 1. ลิงก์ API เดิมของรายการกล้อง
    const API_URL = "https://script.google.com/macros/s/AKfycbxL8VnqCWO-3YuNsMrz5pJ012rLTKTD1gQA2zu8pgENMDQ34YHI8Diyh9NAoVEjskM/exec";
    
    // 2. ลิงก์ API ใหม่ของ Wash Log ที่พี่เพิ่งส่งมา
    const WASH_LOG_API = "https://script.google.com/macros/s/AKfycbxB2ytW3cYMOEs79yOx6drY4_2EN9EVxA9Hqa0hDszzaM1Ql3KnOu92RhVEUgqrcV1U/exec";

    let scopeData = [];
    let usageStats = {}; // เก็บสถิติการล้าง
    let currentFilter = 'all';

    async function fetchData() {
        try {
            // ดึงข้อมูลพร้อมกันทั้ง 2 ลิงก์
            const [scopeRes, washRes] = await Promise.all([
                fetch(API_URL),
                fetch(WASH_LOG_API)
            ]);

            const scopeJson = await scopeRes.json();
            const washJson = await washRes.json();

            if (scopeJson.scopes) {
                scopeData = scopeJson.scopes;
                usageStats = washJson.usageStats || {}; // เก็บจำนวนครั้งแยกตามรหัสกล้อง
                
                updateStats();
                renderUI();
                
                const now = new Date();
                document.getElementById('last-update').innerText = `อัปเดตล่าสุด • ${now.toLocaleTimeString('th-TH')}`;
            }
        } catch (error) {
            console.error("Error:", error);
            document.getElementById('last-update').innerText = "การเชื่อมต่อล้มเหลว";
        }
    }

    function updateStats() {
        const total = scopeData.length;
        const ready = scopeData.filter(s => s.status.includes('พร้อม')).length;
        const repair = total - ready;
        const percent = total > 0 ? Math.round((ready / total) * 100) : 0;

        document.getElementById('count-all').innerText = total;
        document.getElementById('count-ready').innerText = ready;
        document.getElementById('count-repair').innerText = repair;
        document.getElementById('availability-percent').innerText = `${percent}%`;
        document.getElementById('progress-fill').style.width = `${percent}%`;
    }

    function filterData(type) {
        currentFilter = type;
        renderUI();
        // ปรับแต่งสีปุ่ม (เหมือนเดิม)
        document.getElementById('btn-all').className = type === 'all' ? 'px-5 py-2.5 rounded-xl bg-blue-600 text-white shadow-md text-sm font-medium' : 'px-5 py-2.5 rounded-xl bg-white text-blue-600 border border-blue-50 shadow-sm text-sm';
        document.getElementById('btn-ready').className = type === 'ready' ? 'px-5 py-2.5 rounded-xl bg-green-600 text-white shadow-md text-sm font-semibold' : 'px-5 py-2.5 rounded-xl bg-white text-green-600 border border-green-100 shadow-sm text-sm font-semibold';
        document.getElementById('btn-repair').className = type === 'repair' ? 'px-5 py-2.5 rounded-xl bg-red-600 text-white shadow-md text-sm font-semibold' : 'px-5 py-2.5 rounded-xl bg-white text-red-600 border border-red-100 shadow-sm text-sm font-semibold';
    }

    function renderUI() {
        const searchTerm = document.getElementById('search-input').value.toLowerCase();
        let filtered = scopeData.filter(s => 
            s.code.toLowerCase().includes(searchTerm) || 
            (s.brand && s.brand.toLowerCase().includes(searchTerm))
        );

        if (currentFilter === 'ready') filtered = filtered.filter(s => s.status.includes('พร้อม'));
        if (currentFilter === 'repair') filtered = filtered.filter(s => !s.status.includes('พร้อม'));

        const grid = document.getElementById('scope-grid');
        if (filtered.length === 0) {
            grid.innerHTML = `<p class="col-span-full text-center py-10 text-slate-400 font-light italic">ไม่พบข้อมูลที่ค้นหา</p>`;
            return;
        }

        grid.innerHTML = filtered.map(scope => {
            const isReady = scope.status.includes('พร้อม');
            // ดึงจำนวนครั้งจาก usageStats ถ้าไม่มีให้เป็น 0
            const washCount = usageStats[scope.code] || 0; 
            
            return `
                <div class="card bg-white p-5 rounded-2xl shadow-sm border border-slate-50">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <h3 class="text-lg font-bold text-slate-800">${scope.code}</h3>
                                <span class="text-[10px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded font-bold uppercase italic tracking-tighter">
                                    ${scope.brand || '-'}
                                </span>
                            </div>
                            <p class="text-[12px] text-slate-500 font-medium tracking-wide">${scope.type} • ${scope.diameter}mm</p>
                        </div>
                        <span class="px-2.5 py-1 rounded-lg text-[10px] font-bold ${isReady ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}">
                            ${scope.status}
                        </span>
                    </div>

                    <div class="bg-blue-50/50 rounded-xl p-3 mb-3 flex justify-between items-center border border-blue-100/50">
                        <span class="text-[11px] font-medium text-blue-600 uppercase tracking-wider">Usage History</span>
                        <span class="text-lg font-black text-blue-700">${washCount} <small class="text-[10px] font-normal">ครั้ง</small></span>
                    </div>

                    <div class="mt-2 pt-3 border-t border-slate-50 flex justify-between items-end">
                        <span class="text-[11px] font-semibold text-slate-400">S/N: ${scope.serial}</span>
                        ${!isReady ? `
                            <div class="text-right">
                                <div class="bg-red-50 text-red-600 p-2 rounded-xl border border-red-100 font-bold leading-tight">
                                    <p class="text-[9px]">ส่ง: ${scope.sentDate || '-'}</p>
                                    <p class="text-[10px]">คืน: ${scope.returnDate || '-'}</p>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }).join('');
    }

    document.getElementById('search-input').addEventListener('input', renderUI);
    fetchData();
    // ตั้งเวลาอัปเดตทุก 1 นาที
    setInterval(fetchData, 60000);
</script>
