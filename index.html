<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NCI SCOPETAGLINE - Mobile Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .card { transition: all 0.2s ease; }
        .card:active { transform: scale(0.98); }
        /* ตกแต่ง Scrollbar ให้ดูสะอาดตา */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="safe-area-inset-bottom">

    <!-- Header Section -->
    <div class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200 px-4 py-3 mb-4">
        <div class="flex justify-between items-center max-w-4xl mx-auto">
            <div>
                <h1 class="text-xl font-bold text-blue-900 leading-tight">NCI SCOPE</h1>
                <p class="text-[10px] text-slate-500 uppercase tracking-wider">National Cancer Institute</p>
            </div>
            <div class="text-right">
                <div id="status-dot" class="inline-block w-2 h-2 rounded-full bg-green-500 animate-pulse mr-1"></div>
                <span id="last-update" class="text-[10px] text-slate-400 font-medium text-xs">กำลังโหลด...</span>
            </div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto px-4 pb-20">
        
        <!-- Summary Dashboard (Mobile Grid) -->
        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-center">
                <p class="text-xs text-slate-400 mb-1">กล้องพร้อมใช้</p>
                <p id="ready-count" class="text-3xl font-bold text-green-500">-</p>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-center">
                <p class="text-xs text-slate-400 mb-1">ส่งซ่อม</p>
                <p id="repair-count" class="text-3xl font-bold text-red-500">-</p>
            </div>
        </div>

        <!-- Search Box (Large for Touch) -->
        <div class="relative mb-6">
            <input type="text" id="search-input" 
                class="w-full p-4 pl-12 rounded-2xl bg-white border-none shadow-sm text-slate-700 focus:ring-2 focus:ring-blue-500 outline-none transition-all placeholder:text-slate-300" 
                placeholder="ค้นหารหัสกล้อง...">
            <svg class="w-6 h-6 absolute left-4 top-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
        </div>

        <!-- Scope Cards Grid -->
        <div id="scope-grid" class="grid grid-cols-1 gap-4">
            <!-- Loading State -->
            <div class="text-center py-20">
                <div class="inline-block w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                <p class="mt-4 text-slate-400 text-sm">กำลังเชื่อมต่อฐานข้อมูล...</p>
            </div>
        </div>
    </div>

    <!-- Script Section -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxL8VnqCWO-3YuNsMrz5pJ012rLTKTD1gQA2zu8pgENMDQ34YHI8Diyh9NAoVEjskM/exec";
        let scopeData = [];

        async function fetchScopes() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                scopeData = data.scopes;
                
                updateDisplay();
                
                // อัปเดตเวลาล่าสุด
                const now = new Date();
                document.getElementById('last-update').innerText = `อัปเดตเมื่อ: ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
                
                // กะพริบไฟสีเขียวบอกว่าสำเร็จ
                const dot = document.getElementById('status-dot');
                dot.classList.replace('bg-slate-300', 'bg-green-500');
            } catch (error) {
                console.error("Fetch error:", error);
                document.getElementById('last-update').innerText = "เชื่อมต่อล้มเหลว";
                document.getElementById('status-dot').classList.replace('bg-green-500', 'bg-red-500');
            }
        }

        function updateDisplay() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const filtered = scopeData.filter(s => s.code.toLowerCase().includes(searchTerm));
            
            // สรุปยอด
            const ready = scopeData.filter(s => s.status.includes('พร้อม')).length;
            const repair = scopeData.length - ready;
            document.getElementById('ready-count').innerText = ready;
            document.getElementById('repair-count').innerText = repair;

            // วาดการ์ด
            const grid = document.getElementById('scope-grid');
            grid.innerHTML = filtered.map(scope => {
                const isReady = scope.status.includes('พร้อม');
                return `
                    <div class="card bg-white p-4 rounded-2xl shadow-sm border border-slate-50 flex flex-col">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-lg font-bold text-slate-800">${scope.code}</span>
                            <span class="px-3 py-1 rounded-lg text-[10px] font-bold uppercase ${isReady ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}">
                                ${scope.status}
                            </span>
                        </div>
                        <div class="flex justify-between items-end">
                            <div class="text-[11px] text-slate-400">
                                <p>${scope.type} • ${scope.diameter} mm</p>
                                <p>S/N: ${scope.serial}</p>
                            </div>
                            ${!isReady ? `
                                <div class="text-[10px] text-right bg-red-50 p-2 rounded-xl border border-red-100 text-red-500">
                                    <p>คืน: ${scope.returnDate}</p>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ระบบค้นหาแบบ Real-time
        document.getElementById('search-input').addEventListener('input', updateDisplay);

        // ดึงข้อมูลครั้งแรก
        fetchScopes();

        // ** ระบบ Auto-Refresh ทุกๆ 60 วินาที **
        setInterval(() => {
            document.getElementById('status-dot').classList.replace('bg-green-500', 'bg-slate-300');
            fetchScopes();
        }, 60000); 

    </script>
</body>
</html>
