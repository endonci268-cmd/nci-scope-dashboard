<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NCI SCOPE TAGLINE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f4f7fa; }
        .card-main { background: white; border-radius: 2.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        .usage-box { background: #f0f7ff; border-radius: 1.5rem; padding: 1.25rem; border: 1px solid #e1efff; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .animate-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .sticky-header { position: sticky; top: 0; z-index: 50; background: rgba(244, 247, 250, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="p-3 sm:p-6 md:p-8">

    <div class="max-w-4xl mx-auto">
        <div class="mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="text-center md:text-left">
                <h1 class="text-2xl font-black text-blue-900 leading-none uppercase">NCI SCOPE TAGLINE</h1>
                <p class="text-[10px] font-bold text-slate-400 mt-1 uppercase">ศูนย์ส่องกล้องฯ สถาบันมะเร็งแห่งชาติ</p>
            </div>
            <div id="ready-percent-label" class="bg-blue-600 text-white px-8 py-2 rounded-full font-black text-lg shadow-lg">
                พร้อมใช้ 0%
            </div>
        </div>

        <div class="sticky-header py-2 space-y-3 mb-6">
            <input type="text" id="search-input" placeholder="ค้นหาชื่อหรือ S/N..." class="w-full p-4 rounded-2xl border-none shadow-lg focus:ring-2 focus:ring-blue-500 outline-none font-bold text-slate-700">
            <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                <button onclick="setFilter('all')" id="btn-all" class="flex-shrink-0 px-6 py-2 rounded-xl bg-slate-800 text-white font-bold text-xs shadow-md">ทั้งหมด (<span id="c-all">0</span>)</button>
                <button onclick="setFilter('ready')" id="btn-ready" class="flex-shrink-0 px-6 py-2 rounded-xl bg-white text-slate-500 font-bold text-xs border border-slate-200">พร้อมใช้ (<span id="c-ready">0</span>)</button>
                <button onclick="setFilter('repair')" id="btn-repair" class="flex-shrink-0 px-6 py-2 rounded-xl bg-white text-rose-500 font-bold text-xs border border-slate-200">ส่งซ่อม (<span id="c-repair">0</span>)</button>
            </div>
        </div>

        <div id="scope-list" class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-12"></div>

        <div class="card-main p-6 md:p-8 animate-in border border-white mb-20">
            <div class="flex items-center gap-3 mb-6">
                <div class="w-10 h-10 bg-blue-100 rounded-xl flex items-center justify-center">
                    <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <h2 class="text-xl font-black text-slate-800 uppercase italic">Wash Log History</h2>
            </div>
            
            <div class="overflow-x-auto no-scrollbar">
                <table class="w-full text-left">
                    <thead>
                        <tr class="text-[10px] text-slate-300 font-black uppercase border-b border-slate-50">
                            <th class="pb-4 pr-4">วันเวลาที่ลงข้อมูล</th>
                            <th class="pb-4 pr-4 text-center">รหัสกล้อง</th>
                            <th class="pb-4">Serial Number</th>
                        </tr>
                    </thead>
                    <tbody id="wash-log-body">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxL8VnqCWO-3YuNsMrz5pJ012rLTKTD1gQA2zu8pgENMDQ34YHI8Diyh9NAoVEjskM/exec";
        const WASH_LOG_API = "https://script.google.com/macros/s/AKfycbwUY36cqp5ns2dM5LgT0_MqmwH8k5riXXLDEb3JWo7kzfu81rumQ1opt5URik1H2fCC/exec";

        let allScopes = [], washData = { usageStats: {}, recentWashes: [] }, currentFilter = 'all';

        async function init() {
            try {
                const [sRes, wRes] = await Promise.all([
                    fetch(API_URL).then(r => r.json()),
                    fetch(WASH_LOG_API).then(r => r.json())
                ]);
                allScopes = sRes.scopes || sRes || [];
                washData = wRes || washData;
                updateUI();
            } catch (e) { console.error(e); }
        }

        function updateUI() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const list = document.getElementById('scope-list');
            
            const total = allScopes.length;
            const readyCount = allScopes.filter(s => (s.status||"").includes("พร้อม")).length;
            const repairCount = total - readyCount;
            const percent = total > 0 ? Math.round((readyCount/total)*100) : 0;

            document.getElementById('ready-percent-label').innerText = `พร้อมใช้ ${percent}%`;
            document.getElementById('c-all').innerText = total;
            document.getElementById('c-ready').innerText = readyCount;
            document.getElementById('c-repair').innerText = repairCount;

            let filtered = allScopes.filter(s => (s.code||"").toLowerCase().includes(search) || (s.serial||"").toLowerCase().includes(search));
            if (currentFilter === 'ready') filtered = filtered.filter(s => (s.status||"").includes("พร้อม"));
            if (currentFilter === 'repair') filtered = filtered.filter(s => !(s.status||"").includes("พร้อม"));

            // 1. วาดการ์ดกล้อง (ด้านบน)
            list.innerHTML = filtered.map(s => {
                const isReady = (s.status||"").includes("พร้อม");
                const usage = washData.usageStats[s.code] || 0;
                return `
                <div class="card-main p-6 md:p-8 animate-in border border-white flex flex-col h-full">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="text-3xl font-black text-slate-800 tracking-tighter leading-none mb-1 uppercase">${s.code}</h3>
                            <span class="px-2 py-0.5 bg-slate-100 text-slate-400 rounded text-[9px] font-black uppercase italic">${s.brand || 'FUJINON'}</span>
                        </div>
                        <span class="px-3 py-1 rounded-full text-[9px] font-black uppercase ${isReady ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}">
                            ● ${isReady ? 'พร้อมใช้งาน' : 'ส่งซ่อม'}
                        </span>
                    </div>
                    
                    <p class="text-xs font-bold text-slate-300 mb-6 uppercase">${s.type || 'EUS'} • ${s.diameter || '3.8'}mm</p>
                    
                    <div class="usage-box flex justify-between items-center mb-6 shadow-inner">
                        <span class="text-[10px] font-black text-blue-400 uppercase tracking-widest italic">Usage Count</span>
                        <div class="flex items-baseline gap-1">
                            <span class="text-4xl font-black text-blue-700">${usage}</span>
                            <span class="text-[10px] font-bold text-blue-300">ครั้ง</span>
                        </div>
                    </div>

                    <div class="mt-auto pt-6 border-t border-slate-50 flex justify-between items-center">
                        <div>
                            <p class="text-[8px] font-black text-slate-300 uppercase italic">Serial Number</p>
                            <p class="text-sm font-black text-slate-700 tracking-tight">${s.serial || '-'}</p>
                        </div>
                        <div class="w-3 h-3 ${isReady ? 'bg-emerald-400 shadow-[0_0_10px_#4ade80]' : 'bg-rose-400 shadow-[0_0_10px_#f87171]'} rounded-full animate-pulse"></div>
                    </div>

                    ${!isReady ? `
                    <div class="mt-4 p-4 bg-rose-50 rounded-2xl border border-rose-100 text-[11px] font-bold">
                        <div class="flex justify-between"><span>วันที่ส่งซ่อม: ${s.sentDate || '-'}</span><span class="text-rose-700 underline font-black">คืน: ${s.returnDate || '-'}</span></div>
                    </div>` : ''}
                </div>`;
            }).join('');

            // 2. วาดตารางประวัติล้าง (ด้านล่างตามรูปที่ 2)
            document.getElementById('wash-log-body').innerHTML = (washData.recentWashes || []).slice(0, 10).map(w => `
                <tr class="text-xs font-bold text-slate-500 border-b border-slate-50">
                    <td class="py-5 pr-4">${w.date}</td>
                    <td class="py-5 text-center">
                        <span class="bg-blue-50 text-blue-600 px-4 py-2 rounded-xl italic font-black text-sm uppercase">${w.code}</span>
                    </td>
                    <td class="py-5 font-black text-slate-800 text-sm tracking-tight pl-4">${w.sn}</td>
                </tr>
            `).join('');
        }

        function setFilter(f) {
            currentFilter = f;
            ['all', 'ready', 'repair'].forEach(t => {
                const btn = document.getElementById('btn-' + t);
                btn.className = t === f ? "flex-shrink-0 px-6 py-2 rounded-xl bg-slate-800 text-white font-bold text-xs shadow-md" : "flex-shrink-0 px-6 py-2 rounded-xl bg-white text-slate-500 font-bold text-xs border border-slate-200 shadow-sm";
            });
            updateUI();
        }

        document.getElementById('search-input').addEventListener('input', updateUI);
        init(); setInterval(init, 30000);
    </script>
</body>
</html>
