<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NCI Scope</title>

<style>
body{
  margin:0;
  font-family:-apple-system;
  background:linear-gradient(#0ea5e9,#1e3a8a);
  color:white;
}

.header{
  padding:20px;
  font-size:22px;
  font-weight:600;
}

.container{
  padding:15px;
}

.summary{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.box{
  flex:1;
  border-radius:16px;
  padding:12px;
  text-align:center;
  font-size:14px;
  font-weight:600;
}

.green{background:#22c55e;}
.yellow{background:#f59e0b;}
.red{background:#ef4444;}

.card{
  background:rgba(255,255,255,0.15);
  border-radius:20px;
  padding:15px;
  margin-bottom:12px;
}

.code{font-size:18px;font-weight:600;}
.serial{font-size:14px;margin-top:4px;}
.sub{font-size:13px;opacity:0.9;}
.status{margin-top:6px;font-weight:600;}
.detail{margin-top:10px;font-size:13px;display:none;}
</style>
</head>

<body>

<div class="header">NCI Scope</div>

<div class="container">

<div class="summary">
  <div class="box green" id="ready">0</div>
  <div class="box yellow" id="inactive">0</div>
  <div class="box red" id="repair">0</div>
</div>

<div id="info"></div>
<div id="list"></div>

</div>

<script>

// 🔴 ใส่ URL ของคุณตรงนี้
const API_URL = "https://script.google.com/macros/s/AKfycbzFQfa9pe76TWri5f_5LPioMZ0Zq--bqzQ8cnANFs4KYUdgzh_ygnyIwEh7cRhLSLpW/exec";

fetch(API_URL)
.then(res => res.json())
.then(res => {

  const data = res.scopes || [];

  // 🔥 summary
  document.getElementById("ready").innerHTML =
    "🟢 พร้อมใช้งาน<br>" + data.filter(s=>s.status==="พร้อมใช้งาน").length;

  document.getElementById("repair").innerHTML =
    "🔴 ส่งซ่อม<br>" + data.filter(s=>s.status==="ส่งซ่อม").length;

  document.getElementById("inactive").innerHTML =
    "🟡 งดใช้งาน<br>" + data.filter(s=>s.status==="งดใช้งาน").length;

  document.getElementById("info").innerHTML =
    "📊 " + (res.total || data.length) + " รายการ • 🕒 " + (res.updated || "-");

  render(data);

})
.catch(err=>{
  document.getElementById("info").innerHTML = "❌ โหลดข้อมูลไม่สำเร็จ";
  console.error(err);
});

function render(data){

  let html = "";

  data.forEach(s => {

    let color = {
      "พร้อมใช้งาน":"#22c55e",
      "ส่งซ่อม":"#ef4444",
      "งดใช้งาน":"#f59e0b"
    }[s.status] || "#ccc";

    html += `
      <div class="card" onclick="toggle(this)">
        <div class="code">${s.code}</div>
        <div class="serial">SN: ${s.serial}</div>
        <div class="sub">${s.brand} | ${s.type}</div>
        <div class="status" style="color:${color}">${s.status}</div>

        <div class="detail">
          📏 ${s.diameter} mm<br>
          📤 ${s.sentDate || "-"}<br>
          📥 ${s.returnDate || "-"}
        </div>
      </div>
    `;
  });

  document.getElementById("list").innerHTML = html;
}

function toggle(el){
  const d = el.querySelector(".detail");
  d.style.display = d.style.display === "block" ? "none" : "block";
}

</script>

</body>
</html>
