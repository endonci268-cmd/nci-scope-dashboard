<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NCI SCOPE - Modern Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; }
        .card { transition: all 0.2s ease; }
        .card:hover { transform: translateY(-2px); }
        .progress-bar-fill { transition: width 1s ease-in-out; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <div class="mb-8 flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div>
                <h1 class="text-3xl font-bold text-blue-900">NCI SCOPETAGLINE</h1>
                <p class="text-slate-500 text-sm">ระบบจัดการสถานะกล้องส่องตรวจ • สถาบันมะเร็งแห่งชาติ</p>
            </div>
            <div class="text-right">
                <span id="last-update" class="text-[11px] text-slate-400 bg-white px-3 py-1 rounded-full shadow-sm border border-slate-100">กำลังโหลดข้อมูล...</span>
            </div>
        </div>

        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 mb-6">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-2 text-slate-600">
                    <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    <span class="font-medium text-slate-700">อัตราความพร้อมใช้งาน</span>
                </div>
                <span id="availability-percent" class="text-2xl font-bold text-green-600">0%</span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-4 overflow-hidden">
                <div id="progress-fill" class="progress-bar-fill h-full bg-green-500" style="width: 0%"></div>
            </div>
        </div>

        <div class="flex flex-col md:flex-row gap-4 mb-8">
            <div class="relative flex-grow">
                <input type="text" id="search-input" placeholder="ค้นหารหัสกล้อง หรือยี่ห้อ..." 
                    class="w-full p-3 pl-10 rounded-2xl border-none shadow-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white text-slate-700">
                <svg class="w-5 h-5 absolute left-3 top-3.5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            <div class="flex gap-2 overflow-x-auto pb-2 md:pb-0">
                <button onclick="filterData('all')" id="btn-all" class="px-5 py-2.5 rounded-xl bg-blue-600 text-white shadow-md whitespace-nowrap text-sm font-medium">ทั้งหมด <span id="count-all">0</span></button>
                <button onclick="filterData('ready')" id="btn-ready" class="px-5 py-2.5 rounded-xl bg-white text-green-600 border border-green-100 shadow-sm whitespace-nowrap text-sm font-semibold">พร้อมใช้ <span id="count-ready">0</span></button>
                <button onclick="filterData('repair')" id="btn-repair" class="px-5 py-2.5 rounded-xl bg-white text-red-600 border border-red-100 shadow-sm whitespace-nowrap text-sm font-semibold">ส่งซ่อม <span id="count-repair">0</span></button>
            </div>
        </div>

        <div id="scope-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            </div>
    </div>

    <script>
        // 1. ลิงก์ API รายการกล้อง
        const API_URL = "https://script.google.com/macros/s/AKfycbxL8VnqCWO-3YuNsMrz5pJ012rLTKTD1gQA2zu8pgENMDQ34YHI8Diyh9NAoVEjskM/exec";
        // 2. ลิงก์ API WashLog
        const WASH_LOG_API = "https://script.google.com/macros/s/AKfycbxB2ytW3cYMOEs79yOx6drY4_2EN9EVxA9Hqa0hDszzaM1Ql3KnOu92RhVEUgqrcV1U/exec";

        let scopeData = [];
        let usageStats = {};
        let currentFilter = 'all';

        async function fetchData() {
            try {
                // ดึงข้อมูลพร้อมกันทั้ง 2 แหล่ง
                const [scopeRes, washRes] = await Promise.all([
                    fetch(API_URL).then(res => res.json()),
                    fetch(WASH_LOG_API).then(res => res.json())
                ]);

                if (scopeRes && scopeRes.scopes) {
                    scopeData = scopeRes.scopes;
                    usageStats = washRes.usageStats || {};
                    
                    updateStats();
                    renderUI();
                    
                    const now = new Date();
                    document.getElementById('last-update').innerText = `อัปเดตล่าสุด • ${now.toLocaleTimeString('th-TH')}`;
                }
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('last-update').innerText = "การเชื่อมต่อล้มเหลว";
            }
        }

        function updateStats() {
            const total = scopeData.length;
            const ready = scopeData.filter(s => (s.status || "").includes('พร้อม')).length;
            const repair = total - ready;
            const percent = total > 0 ? Math.round((ready / total) * 100) : 0;

            document.getElementById('count-all').innerText = total;
            document.getElementById('count-ready').innerText = ready;
            document.getElementById('count-repair').innerText = repair;
            document.getElementById('availability-percent').innerText = `${percent}%`;
            document.getElementById('progress-fill').style.width = `${percent}%`;
        }

        function filterData(type) {
            currentFilter = type;
            renderUI();
            
            // ปรับแต่งสีปุ่มให้ตรงกับสถานะที่เลือก
            const baseClass = "px-5 py-2.5 rounded-xl shadow-sm text-sm font-semibold whitespace-nowrap border";
            
            document.getElementById('btn-all').className = type === 'all' ? 'px-5 py-2.5 rounded-xl bg-blue-600 text-white shadow-md text-sm font-medium' : 'px-5 py-2.5 rounded-xl bg-white text-blue-600 border border-blue-50 shadow-sm text-sm';
            document.getElementById('btn-ready').className = type === 'ready' ? 'px-5 py-2.5 rounded-xl bg-green-600 text-white shadow-md text-sm font-semibold' : 'px-5 py-2.5 rounded-xl bg-white text-green-600 border border-green-100 shadow-sm text-sm font-semibold';
            document.getElementById('btn-repair').className = type === 'repair' ? 'px-5 py-2.5 rounded-xl bg-red-600 text-white shadow-md text-sm font-semibold' : 'px-5 py-2.5 rounded-xl bg-white text-red-600 border border-red-100 shadow-sm text-sm font-semibold';
        }

        function renderUI() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            
            let filtered = scopeData.filter(s => 
                (s.code || "").toLowerCase().includes(searchTerm) || 
                (s.brand || "").toLowerCase().includes(searchTerm)
            );

            if (currentFilter === 'ready') filtered = filtered.filter(s => (s.status || "").includes('พร้อม'));
            if (currentFilter === 'repair') filtered = filtered.filter(s => !(s.status || "").includes('พร้อม'));

            const grid = document.getElementById('scope-grid');
            if (filtered.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center py-10 text-slate-400 font-light italic">ไม่พบข้อมูลที่ค้นหา</p>`;
                return;
            }

            grid.innerHTML = filtered.map(scope => {
                const isReady = (scope.status || "").includes('พร้อม');
                const washCount = usageStats[scope.code] || 0; 
                
                return `
                    <div class="card bg-white p-5 rounded-2xl shadow-sm border border-slate-50">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <div class="flex items-center gap-2 mb-1">
                                    <h3 class="text-lg font-bold text-slate-800">${scope.code || '-'}</h3>
                                    <span class="text-[10px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded font-bold uppercase italic tracking-tighter">
                                        ${scope.brand || '-'}
                                    </span>
                                </div>
                                <p class="text-[12px] text-slate-500 font-medium tracking-wide">${scope.type || '-'} ${scope.diameter ? '• '+scope.diameter+'mm' : ''}</p>
                            </div>
                            <span class="px-2.5 py-1 rounded-lg text-[10px] font-bold ${isReady ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}">
                                ${scope.status || 'ไม่มีสถานะ'}
                            </span>
                        </div>

                        <div class="bg-blue-50/50 rounded-xl p-3 mb-3 flex justify-between items-center border border-blue-100/30">
                            <span class="text-[11px] font-medium text-blue-600 uppercase tracking-wider">Usage History</span>
                            <span class="text-lg font-black text-blue-700">${washCount} <small class="text-[10px] font-normal text-blue-500">ครั้ง</small></span>
                        </div>

                        <div class="mt-2 pt-3 border-t border-slate-50 flex justify-between items-end">
                            <span class="text-[11px] font-semibold text-slate-400 italic">S/N: ${scope.serial || '-'}</span>
                            ${!isReady ? `
                                <div class="text-right">
                                    <div class="bg-red-50 text-red-600 p-2 rounded-xl border border-red-100 font-bold leading-tight">
                                        <p class="text-[9px]">ส่ง: ${scope.sentDate || '-'}</p>
                                        <p class="text-[10px]">คืน: ${scope.returnDate || '-'}</p>
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        document.getElementById('search-input').addEventListener('input', renderUI);
        
        // เริ่มต้นโหลดข้อมูล
        fetchData();
        
        // ตั้งเวลาอัปเดตอัตโนมัติทุก 1 นาที
        setInterval(fetchData, 60000);
    </script>
</body>
</html>
